<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify — VooVr</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── TOTP background artwork (scoped) ──
   Layered onto the existing body background mechanism (same
   background-attachment:fixed pattern as style.css): a faint ink veil for
   text contrast, the local totp-background.webp artwork, then the original
   radial gradients. Purely decorative layer — no layout impact, sits
   behind the card (which keeps its solid var(--ink) background + z-index). */
body{
  background-image:
    linear-gradient(rgba(8,10,15,0.32), rgba(8,10,15,0.32)),
    url("/totp-background.webp"),
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(80,120,200,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(212,136,74,0.02) 0%, transparent 60%);
  background-size:cover, cover, auto, auto;
  background-position:center center, center center, 0 0, 0 0;
  background-repeat:no-repeat, no-repeat, repeat, repeat;
  background-attachment:fixed, scroll, fixed, fixed;
}
.login-shell{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;
}
.login-card{
  width:100%;max-width:400px;
  background:var(--ink);border:1px solid var(--border);border-radius:16px;
  padding:2.5rem 2rem;
  box-shadow:var(--shadow-lg);
  position:relative;z-index:1;
}
.login-brand{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:1.75rem;
}
.login-brand img{height:28px;width:auto;}

.login-eyebrow{margin-bottom:1rem;text-align:center;}

.login-card h2{
  font-size:1.35rem;text-align:center;margin-bottom:.5rem;
  text-transform:none;letter-spacing:-.01em;
}
.login-desc{
  text-align:center;font-size:.85rem;color:var(--ivory-dim);
  line-height:1.65;margin-bottom:1.75rem;
}

.otp-label{
  display:block;text-align:center;font-size:.78rem;
  color:var(--ivory-dim);margin-bottom:.6rem;
}
.otp-segments{
  display:flex;justify-content:center;gap:8px;margin-bottom:1.25rem;
}
.otp-seg{
  width:48px;height:54px;
  font-family:'Space Mono',monospace;font-size:1.25rem;font-weight:600;
  text-align:center;color:var(--ivory);
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
  caret-color:var(--violet);
}
.otp-seg::placeholder{color:var(--ivory-faint);}
.otp-seg:focus{
  border-color:var(--violet);
  background:var(--violet-soft);
  box-shadow:0 0 0 3px var(--violet-glow);
}
.otp-seg:disabled{opacity:.35;cursor:not-allowed;}

.login-error{
  display:none;text-align:center;font-size:.8rem;
  color:var(--red);background:var(--red-soft);
  border:1px solid var(--red-glow);border-radius:8px;
  padding:.65rem .9rem;margin-bottom:1rem;
}
.login-success{
  display:none;text-align:center;font-size:.8rem;
  color:var(--teal);background:var(--teal-soft);
  border:1px solid var(--teal-glow);border-radius:8px;
  padding:.65rem .9rem;margin-bottom:1rem;
}

.login-btn{
  width:100%;padding:.85rem;border-radius:10px;
  font-size:.9rem;font-weight:600;letter-spacing:-.005em;
  color:#fff;background:var(--violet);
  border:none;cursor:pointer;
  box-shadow:0 4px 16px var(--violet-glow);
  transition:background .2s,box-shadow .2s,transform .15s;
}
.login-btn:hover{background:#6a3fe0;box-shadow:0 6px 24px var(--violet-glow);}
.login-btn:active{transform:scale(.985);}
.login-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

.login-footer{
  text-align:center;margin-top:1.25rem;font-size:.75rem;
  color:var(--ivory-faint);
}

/* Backup code toggle */
.backup-toggle{
  text-align:center;margin-top:.75rem;font-size:.78rem;
}
.backup-toggle a{
  color:var(--ivory-faint);cursor:pointer;text-decoration:underline;
  transition:color .2s;
}
.backup-toggle a:hover{color:var(--amber);}

/* Backup code input mode */
.backup-mode{
  display:none;
}
.backup-input-wrap{
  display:flex;justify-content:center;margin-bottom:1.25rem;
}
.backup-input{
  width:100%;max-width:260px;padding:.7rem 1rem;
  font-family:'Space Mono',monospace;font-size:1rem;font-weight:600;
  text-align:center;letter-spacing:.1em;color:var(--ivory);
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
  caret-color:var(--violet);
}
.backup-input::placeholder{color:var(--ivory-faint);letter-spacing:.05em;}
.backup-input:focus{
  border-color:var(--violet);
  background:var(--violet-soft);
  box-shadow:0 0 0 3px var(--violet-glow);
}
.backup-label{
  display:block;text-align:center;font-size:.78rem;
  color:var(--ivory-dim);margin-bottom:.6rem;
}

[data-reveal]{opacity:0;animation:revealFade .7s cubic-bezier(0.16,1,0.3,1) forwards;animation-delay:.3s;}
.gsap-active [data-reveal]{animation:none;}
@keyframes revealFade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:520px){
  .login-card{padding:2rem 1.25rem;}
  .otp-seg{width:42px;height:48px;font-size:1.1rem;}
}
</style>
<link rel="stylesheet" href="/page-transition.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/csrf.js"></script>
</head>
<body>
<div id="voovr-page-transition"><div class="vpt-inner"><span class="vpt-dot"></span><span class="vpt-dot"></span><span class="vpt-dot"></span></div></div>

<div class="login-shell">
  <div class="login-card">

    <div class="login-brand" data-reveal>
      <img src="/voovr-logo-full.png" alt="VooVr">
    </div>

    <div class="eyebrow login-eyebrow" data-reveal>Security Verification</div>

    <h2 data-reveal>Verify it's you</h2>
    <p class="login-desc" data-reveal>Enter the 6-digit code from your authenticator app to continue to the dashboard.</p>

    <label class="otp-label" data-reveal>Authenticator code</label>
    <div class="otp-segments" id="otpSegments" data-reveal>
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 1" autocomplete="one-time-code">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 2" autocomplete="off">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 3" autocomplete="off">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 4" autocomplete="off">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 5" autocomplete="off">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-seg" aria-label="Digit 6" autocomplete="off">
    </div>

    <div class="login-error" id="loginError"></div>
    <div class="login-success" id="loginSuccess"></div>

    <button class="login-btn" id="verifyBtn" disabled>Verify</button>

    <!-- Backup code toggle -->
    <div class="backup-toggle" id="backupToggleWrap" data-reveal>
      <a id="backupToggleLink">Lost your device? Use a backup code</a>
    </div>

    <!-- Backup code input (hidden by default) -->
    <div class="backup-mode" id="backupMode">
      <label class="backup-label">Enter a backup code (XXXX-XXXX)</label>
      <div class="backup-input-wrap">
        <input type="text" class="backup-input" id="backupCodeInput" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off">
      </div>
      <button class="login-btn" id="backupVerifyBtn" disabled>Verify Backup Code</button>
    </div>

    <div class="login-footer" data-reveal>You'll be redirected after verification.</div>

  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(typeof gsap==='undefined'){document.querySelectorAll('[data-reveal]').forEach((el,i)=>{el.style.animation='revealFade .7s cubic-bezier(0.16,1,0.3,1) forwards';el.style.animationDelay=(i*60)+'ms';});return;}
  document.documentElement.classList.add('gsap-active');
  var tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.fromTo('.login-card',
    {opacity:0,y:24,filter:'blur(10px)'},
    {opacity:1,y:0,filter:'blur(0px)',duration:.9}
  ,0)
  .fromTo('.login-card [data-reveal]',
    {opacity:0,y:14},
    {opacity:1,y:0,duration:.7,stagger:.06}
  ,.3);
});
</script>
<script>
(function(){
  var segs      = Array.prototype.slice.call(document.querySelectorAll('.otp-seg'));
  var verifyBtn = document.getElementById('verifyBtn');
  var errBox    = document.getElementById('loginError');
  var okBox     = document.getElementById('loginSuccess');

  function getReturnUrl(){
    var p=new URLSearchParams(window.location.search);
    return p.get('next')||'/dashboard';
  }

  function setErr(m){ errBox.textContent=m; errBox.style.display=m?'block':'none'; okBox.style.display='none'; }
  function setOk(m){ okBox.textContent=m; okBox.style.display=m?'block':'none'; errBox.style.display='none'; }
  function getCode(){ return segs.map(function(s){return s.value;}).join(''); }

  segs.forEach(function(inp,i){
    inp.addEventListener('input',function(){
      var v=inp.value.replace(/\D/g,'');
      inp.value=v;
      if(v&&i<segs.length-1) segs[i+1].focus();
      verifyBtn.disabled=getCode().length!==6;
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!inp.value&&i>0){e.preventDefault();segs[i-1].focus();segs[i-1].value='';}
      if(e.key==='ArrowLeft'&&i>0){e.preventDefault();segs[i-1].focus();}
      if(e.key==='ArrowRight'&&i<segs.length-1){e.preventDefault();segs[i+1].focus();}
    });
    inp.addEventListener('paste',function(e){
      e.preventDefault();
      var p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
      var rem=segs.length-i;
      p.slice(0,rem).split('').forEach(function(ch,j){segs[i+j].value=ch;});
      var nxt=i+Math.min(p.length,rem);
      if(nxt<segs.length) segs[nxt].focus(); else segs[segs.length-1].focus();
      verifyBtn.disabled=getCode().length!==6;
    });
  });

  verifyBtn.addEventListener('click',function(){
    var code=getCode();
    if(code.length!==6){setErr('Enter the 6-digit code from your authenticator app.');return;}
    verifyBtn.disabled=true;
    setErr('');setOk('');

    fetch('/auth/totp/verify-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code})
    })
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){
        setErr(d.error==='invalid_code'?'Invalid code. Please try again.':d.error);
        verifyBtn.disabled=false;
        segs.forEach(function(s){s.value='';});
        segs[0].focus();
        return;
      }
      setOk('Verified! Redirecting\u2026');
      setTimeout(function(){window.location.href=getReturnUrl();},1000);
    })
    .catch(function(){
      setErr('Network error. Please try again.');
      verifyBtn.disabled=false;
    });
  });

  segs[segs.length-1].addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!verifyBtn.disabled) verifyBtn.click();
  });

  /* ── Backup code toggle ── */
  var backupToggleLink=document.getElementById('backupToggleLink');
  var backupToggleWrap=document.getElementById('backupToggleWrap');
  var backupMode=document.getElementById('backupMode');
  var backupInput=document.getElementById('backupCodeInput');
  var backupVerifyBtn=document.getElementById('backupVerifyBtn');
  var otpLabel=document.querySelector('.otp-label');
  var otpSegmentsWrap=document.getElementById('otpSegments');
  var backupModeActive=false;

  backupToggleLink.addEventListener('click',function(){
    backupModeActive=!backupModeActive;
    if(backupModeActive){
      otpLabel.style.display='none';
      otpSegmentsWrap.style.display='none';
      verifyBtn.style.display='none';
      backupMode.style.display='block';
      backupToggleLink.textContent='Use authenticator app instead';
      backupInput.focus();
    } else {
      otpLabel.style.display='';
      otpSegmentsWrap.style.display='';
      verifyBtn.style.display='';
      backupMode.style.display='none';
      backupToggleLink.textContent='Lost your device? Use a backup code';
      segs[0].focus();
    }
  });

  /* ── Backup code input formatting ── */
  backupInput.addEventListener('input',function(){
    var v=backupInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);
    backupInput.value=v;
    backupVerifyBtn.disabled=v.replace('-','').length!==8;
  });

  /* ── Backup code verification ── */
  backupVerifyBtn.addEventListener('click',function(){
    var code=backupInput.value.trim();
    if(!code){setErr('Enter a backup code.');return;}
    backupVerifyBtn.disabled=true;
    setErr('');setOk('');

    fetch('/auth/totp/verify-login-backup',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code})
    })
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){
        setErr(d.error==='invalid_code'?'Invalid or already used backup code.':d.error);
        backupVerifyBtn.disabled=false;
        backupInput.value='';
        backupInput.focus();
        return;
      }
      var msg='Verified! Redirecting\u2026';
      if(d.codes_remaining<=2&&d.codes_remaining>=0){
        msg+=' ('+d.codes_remaining+' backup codes remaining)';
      }
      setOk(msg);
      setTimeout(function(){window.location.href=getReturnUrl();},1000);
    })
    .catch(function(){
      setErr('Network error. Please try again.');
      backupVerifyBtn.disabled=false;
    });
  });

  backupInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!backupVerifyBtn.disabled) backupVerifyBtn.click();
  });
})();
</script>

<script src="/page-transition.js"></script>
</body>
</html>
