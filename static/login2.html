<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VooVr - Sign In</title>
  <!-- shared-head -->
  <link rel="stylesheet" href="/style.css">
  <script src="/csrf.js"></script>
  <script src="/ui-feedback.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="/voovr-logo-full.webp" alt="VooVr" class="auth-logo">
    <section id="credentialsStep" aria-labelledby="loginTitle">
      <h1 class="auth-title" id="loginTitle">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your VooVr workspace.</p>
      <form id="loginForm" novalidate>
        <div data-feedback hidden></div>
        <div class="auth-field">
          <label for="emailInput">Email address</label>
          <input type="email" id="emailInput" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="passwordInput">Password</label>
          <div class="auth-password">
            <input type="password" id="passwordInput" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="auth-reveal" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="auth-links"><a href="/forgot-password">Forgot password?</a><a href="/signup">Create account</a></div>
        <button type="submit" class="auth-primary">Sign in</button>
      </form>
      <div class="auth-divider">or</div>
      <a href="/auth/google/signin" class="auth-secondary">Continue with Google</a>
    </section>
    <section id="otpStep" aria-labelledby="otpTitle" hidden>
      <h1 class="auth-title" id="otpTitle">Verify your identity</h1>
      <p id="otpEmailDisplay" class="auth-subtitle">Enter the 6-digit code sent to your email.</p>
      <form id="otpForm" novalidate>
        <div data-feedback hidden></div>
        <div class="auth-field">
          <label for="otpInput">Verification code</label>
          <input id="otpInput" class="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <button type="submit" class="auth-primary" id="verifyBtn">Verify &amp; sign in</button>
      </form>
      <div class="auth-links auth-resend">
        <button type="button" class="auth-text-button" id="resendLink">Resend code</button>
        <span id="countdown" class="text-muted"></span>
      </div>
      <button type="button" class="auth-secondary" id="changeEmailLink">Change email</button>
    </section>
  </main>
  <footer class="site-footer">
    <span>© 2026 VooVr. All rights reserved.</span>
    <nav aria-label="Legal"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="mailto:voovrhr@gmail.com">Contact</a></nav>
  </footer>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var loginForm = document.getElementById('loginForm');
    var otpForm = document.getElementById('otpForm');
    var credentials = document.getElementById('credentialsStep');
    var otpStep = document.getElementById('otpStep');
    var emailInput = document.getElementById('emailInput');
    var passwordInput = document.getElementById('passwordInput');
    var otpInput = document.getElementById('otpInput');
    var resend = document.getElementById('resendLink');
    var countdown = document.getElementById('countdown');
    var pendingEmail = '';
    var timer;
    var redirect = new URLSearchParams(location.search).get('redirect') || '/dashboard';
    function navigate(path) {
      var destination = new URL(path || redirect, location.origin);
      location.href = destination.origin === location.origin ? destination.href : '/dashboard';
    }
    function startCountdown(seconds) {
      clearInterval(timer);
      var end = Date.now() + Math.max(1, Number(seconds) || 60) * 1000;
      resend.disabled = true;
      function tick() {
        var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        countdown.textContent = left ? 'Resend in ' + left + 's' : '';
        if (!left) { clearInterval(timer); resend.disabled = false; }
      }
      tick();
      timer = setInterval(tick, 1000);
    }
    function showCredentials() {
      VooVrUI.clear();
      clearInterval(timer);
      pendingEmail = '';
      otpInput.value = '';
      otpStep.hidden = true;
      credentials.hidden = false;
      emailInput.focus();
    }
    function showOtp(email) {
      VooVrUI.clear();
      pendingEmail = email;
      var parts = email.split('@');
      document.getElementById('otpEmailDisplay').textContent = 'Enter the code sent to ' + parts[0].charAt(0) + '***@' + parts[1] + '.';
      credentials.hidden = true;
      otpStep.hidden = false;
      passwordInput.value = '';
      otpInput.focus();
      startCountdown(60);
    }
    async function post(url, body) {
      var response = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      return response.json();
    }
    document.getElementById('togglePassword').addEventListener('click', function () {
      var visible = passwordInput.type === 'password';
      passwordInput.type = visible ? 'text' : 'password';
      this.textContent = visible ? 'Hide' : 'Show';
      this.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      this.setAttribute('aria-pressed', String(visible));
    });
    document.getElementById('changeEmailLink').addEventListener('click', showCredentials);
    otpInput.addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      var button = loginForm.querySelector('[type="submit"]');
      if (button.disabled) return;
      VooVrUI.clear();
      var email = emailInput.value.trim();
      if (!email || !passwordInput.value) return VooVrUI.show('Please enter both email and password.');
      if (!emailInput.validity.valid) return VooVrUI.show('Please enter a valid email address.');
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        var data = await post('/auth/email/signin', {email: email, password: passwordInput.value});
        if ((data.ok && data.requires_otp) || data.error === 'account_requires_otp') showOtp(email);
        else if (data.ok) navigate(data.redirect);
        else if (data.error === 'locked') VooVrUI.show('Too many failed attempts. Try again in ' + Math.ceil((data.retry_after || 60) / 60) + ' minute(s).');
        else if (data.error === 'google_only_account') VooVrUI.show('This account uses Google sign-in. Please use Continue with Google.');
        else VooVrUI.show(data.message || 'Invalid email or password. Please try again.');
      } catch (error) { VooVrUI.show('Could not reach the server. Check your connection and try again.'); }
      finally { button.disabled = false; button.textContent = 'Sign in'; }
    });
    otpForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      var button = document.getElementById('verifyBtn');
      if (button.disabled) return;
      VooVrUI.clear();
      if (!/^\d{6}$/.test(otpInput.value)) return VooVrUI.show('Please enter the 6-digit code.');
      button.disabled = true;
      button.textContent = 'Verifying…';
      try {
        var data = await post('/auth/email/verify-otp', {otp: otpInput.value});
        if (data.ok) navigate(data.redirect);
        else if (data.error === 'session_expired') { showCredentials(); VooVrUI.show('Your session expired. Please sign in again.'); }
        else if (data.error === 'expired') VooVrUI.show('Your code expired. Use Resend code to get a new one.');
        else if (data.error === 'too_many_attempts') VooVrUI.show('Too many incorrect attempts. Please wait and try again.');
        else VooVrUI.show(data.message || 'That code is incorrect. Please try again.');
      } catch (error) { VooVrUI.show('Could not reach the server. Check your connection and try again.'); }
      finally { button.disabled = false; button.textContent = 'Verify & sign in'; }
    });
    resend.addEventListener('click', async function () {
      if (resend.disabled || !pendingEmail) return;
      VooVrUI.clear();
      resend.disabled = true;
      resend.textContent = 'Sending…';
      try {
        var data = await post('/auth/email/resend-otp', {email: pendingEmail});
        if (data.ok) { startCountdown(60); VooVrUI.show('A new code has been sent.', {kind: 'success'}); }
        else if (data.error === 'cooldown') startCountdown(data.retry_after);
        else {
          if (data.error === 'expired' || data.error === 'session_expired') showCredentials();
          VooVrUI.show(data.message || 'Could not resend the code. Please sign in again.');
          resend.disabled = false;
        }
      } catch (error) { resend.disabled = false; VooVrUI.show('Could not reach the server. Please try again.'); }
      finally { resend.textContent = 'Resend code'; }
    });
  });
  </script>
  <script src="/legal-preload.js"></script>
</body>
</html>
