<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - VooVr</title>
  <!-- shared-head -->
  <link rel="stylesheet" href="/style.css">
  <script src="/csrf.js"></script>
  <script src="/ui-feedback.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="/voovr-logo-full.webp" alt="VooVr" class="auth-logo">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Get started with your VooVr workspace.</p>
    <form id="signupForm" novalidate>
      <div data-feedback hidden></div>
      <div class="auth-field"><label for="orgNameInput">Organization name</label><input type="text" id="orgNameInput" autocomplete="organization" required placeholder="Your company"></div>
      <div class="auth-field"><label for="industryInput">Industry</label><input type="text" id="industryInput" required placeholder="e.g. Technology"></div>
      <div class="auth-field"><label for="companySizeInput">Company size</label><select id="companySizeInput" required><option value="">Select company size</option><option>1-10</option><option>11-50</option><option>51-200</option><option>201-1000</option><option>1000+</option></select></div>
      <div class="auth-field"><label for="emailInput">Email address</label><input type="email" id="emailInput" autocomplete="email" required placeholder="you@company.com"></div>
      <div class="auth-field">
        <label for="passwordInput">Password</label>
        <div class="auth-password"><input type="password" id="passwordInput" autocomplete="new-password" minlength="8" aria-describedby="passwordHint" required><button type="button" class="auth-reveal" data-toggle="passwordInput" aria-label="Show password" aria-pressed="false">Show</button></div>
        <p id="passwordHint" class="auth-hint">Use at least 8 characters, including letters and numbers.</p>
      </div>
      <div class="auth-field">
        <label for="confirmPasswordInput">Confirm password</label>
        <div class="auth-password"><input type="password" id="confirmPasswordInput" autocomplete="new-password" required><button type="button" class="auth-reveal" data-toggle="confirmPasswordInput" aria-label="Show password confirmation" aria-pressed="false">Show</button></div>
      </div>
      <div class="auth-check"><input type="checkbox" id="termsCheckbox" required><label for="termsCheckbox">I agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</label></div>
      <button type="submit" id="signupBtn" class="auth-primary">Create account</button>
    </form>
    <div class="auth-divider">or</div>
    <a href="/onboarding" class="auth-secondary">Continue with Google</a>
    <p class="auth-subtitle auth-resend">Already have an account? <a href="/login">Sign in</a></p>
  </main>
  <footer class="site-footer"><span>© 2026 VooVr. All rights reserved.</span><nav aria-label="Legal"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="mailto:voovrhr@gmail.com">Contact</a></nav></footer>
  <script>
  document.querySelectorAll('[data-toggle]').forEach(function (button) {
    button.addEventListener('click', function () {
      var input = document.getElementById(button.dataset.toggle);
      var visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.textContent = visible ? 'Hide' : 'Show';
      button.setAttribute('aria-label', (visible ? 'Hide' : 'Show') + ' ' + (input.id === 'passwordInput' ? 'password' : 'password confirmation'));
      button.setAttribute('aria-pressed', String(visible));
    });
  });
  document.getElementById('signupForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var button = document.getElementById('signupBtn');
    if (button.disabled) return;
    VooVrUI.clear();
    var orgName = document.getElementById('orgNameInput').value.trim();
    var industry = document.getElementById('industryInput').value.trim();
    var companySize = document.getElementById('companySizeInput').value;
    var email = document.getElementById('emailInput');
    var password = document.getElementById('passwordInput').value;
    if (!orgName || !industry || !companySize) return VooVrUI.show('Please enter your organization name, industry, and company size.');
    if (!email.value.trim() || !email.validity.valid) return VooVrUI.show('Please enter a valid email address.');
    if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/\d/.test(password)) return VooVrUI.show('Use at least 8 characters, including letters and numbers.');
    if (password !== document.getElementById('confirmPasswordInput').value) return VooVrUI.show('Your passwords do not match.');
    if (!document.getElementById('termsCheckbox').checked) return VooVrUI.show('Please accept the Terms of Service and Privacy Policy to continue.');
    button.disabled = true;
    button.textContent = 'Creating account…';
    try {
      var orgResponse = await fetch('/api/onboarding/org', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({orgName: orgName, industry: industry, companySize: companySize})});
      if (!orgResponse.ok) throw new Error('Organization setup failed');
      var response = await fetch('/auth/email/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email.value.trim(), password: password})});
      var data = await response.json();
      if (data.ok) {
        sessionStorage.setItem('voovr_pending_email', email.value.trim());
        location.href = '/verify-otp';
      } else {
        var messages = {already_registered: 'This email is already registered. Please sign in.', weak_password: 'Use at least 8 characters, including letters and numbers.', missing_org: 'Organization setup expired. Please try again.', email_failed: 'We could not send the verification code. Please try again.'};
        VooVrUI.show(data.message || messages[data.error] || 'Sign up failed. Please try again.');
      }
    } catch (error) { VooVrUI.show('Could not reach the server. Check your connection and try again.'); }
    finally { button.disabled = false; button.textContent = 'Create account'; }
  });
  </script>
  <script src="/legal-preload.js"></script>
</body>
</html>
