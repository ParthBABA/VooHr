<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - HR Copilot</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/csrf.js"></script>
</head>
<body style="background:var(--void); color:var(--ivory); font-family:var(--font-b); font-size:15px; line-height:1.6; min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px 24px; box-sizing:border-box;">
  <div class="login-card" style="background:var(--ink); border:1px solid var(--border); border-radius:12px; padding:40px 32px 32px; max-width:420px; width:100%; box-shadow:var(--shadow-md); position:relative; z-index:10;">
    <!-- Logo -->
    <div class="text-center mb-6">
      <img src="voovr-logo-full.webp" alt="voovrHR" style="width:120px; height:auto; border-radius:8px; margin:0 auto 12px; display:block;">
      <p style="font-family:var(--font-lato); font-size:0.85rem; color:var(--ivory-faint); letter-spacing:0.04em; text-transform:uppercase; margin:8px 0 0;">Create your account</p>
    </div>

    <!-- Form -->
    <form id="signupForm" novalidate>
      <!-- Full name -->
      <div style="margin-bottom:24px;">
        <label style="display:block; font-family:var(--font-lato); font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); margin-bottom:8px;">Full name</label>
        <input type="text" id="fullNameInput" required style="width:100%; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-size:0.9rem; outline:none; transition:border-color 0.2s;" placeholder="Jane Doe">
      </div>

      <!-- Email -->
      <div style="margin-bottom:24px;">
        <label style="display:block; font-family:var(--font-lato); font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); margin-bottom:8px;">Email address</label>
        <input type="email" id="emailInput" required style="width:100%; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-size:0.9rem; outline:none; transition:border-color 0.2s;" placeholder="you@company.com">
      </div>

      <!-- Password -->
      <div style="margin-bottom:24px; position:relative;">
        <label style="display:block; font-family:var(--font-lato); font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); margin-bottom:8px;">Password</label>
        <input type="password" id="passwordInput" required minlength="8" style="width:100%; padding:12px 16px 12px 48px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-size:0.9rem; outline:none; transition:border-color 0.2s;" placeholder="••••••••">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ivory-faint); font-size:1.2rem; pointer-events:none;">•</span>
        <button type="button" class="icon-btn" style="position:absolute; right:16px; top:50%; transform:translateY(-50%);" id="togglePassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <!-- Confirm Password -->
      <div style="margin-bottom:24px; position:relative;">
        <label style="display:block; font-family:var(--font-lato); font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); margin-bottom:8px;">Confirm password</label>
        <input type="password" id="confirmPasswordInput" required style="width:100%; padding:12px 16px 12px 48px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-size:0.9rem; outline:none; transition:border-color 0.2s;" placeholder="••••••••">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ivory-faint); font-size:1.2rem; pointer-events:none;">•</span>
        <button type="button" class="icon-btn" style="position:absolute; right:16px; top:50%; transform:translateY(-50%);" id="toggleConfirmPassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <!-- Terms checkbox -->
      <div style="margin-bottom:24px; display:flex; align-items:flex-start; gap:10px;">
        <input type="checkbox" id="termsCheckbox" required style="width:18px; height:18px; accent-color:var(--amber); flex-shrink:0; margin-top:2px;">
        <label for="termsCheckbox" style="font-family:var(--font-lato); font-size:0.7rem; color:var(--ivory-faint); line-height:1.5;">
          I agree to the <a href="/terms-of-service" target="_blank" rel="noopener noreferrer" style="color:var(--amber); text-decoration:underline;">Terms of Service</a> and <a href="/privacy-policy" target="_blank" rel="noopener noreferrer" style="color:var(--amber); text-decoration:underline;">Privacy Policy</a>
        </label>
      </div>
      <div id="termsError" style="display:none; margin-bottom:16px; font-family:var(--font-lato); font-size:0.65rem; color:var(--amber);">Please accept the Terms of Service to continue.</div>

      <!-- Create Account button -->
      <div style="text-align:center; margin-bottom:24px;">
        <button type="submit" id="signupBtn" class="btn btn-primary w-full" disabled style="background:linear-gradient(135deg,var(--violet),var(--amber)); color:var(--void); font-family:var(--font-lato); font-weight:700; font-size:0.9rem; letter-spacing:0.04em; text-transform:uppercase; padding:16px 24px; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px; border-radius:8px; border:none; opacity:0.5; cursor:not-allowed;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><line x1="9" y1="20" x2="9.01" y2="20"/><line x1="15" y1="20" x2="15.01" y2="20"/></svg>
          Create Account
        </button>
      </div>

      <!-- Divider OR -->
      <div style="position:relative; margin-bottom:24px;">
        <div style="position:absolute; inset:0; display:flex; align-items:center;">
          <div style="width:100%; border-top:1px solid var(--border);"></div>
        </div>
        <div style="position:relative; background:var(--ink); padding:0 16px; display:inline-block;">
          <span style="font-family:var(--font-lato); font-size:0.65rem; color:var(--ivory-faint); letter-spacing:0.08em; text-transform:uppercase;">OR</span>
        </div>
      </div>

      <!-- Continue with Google button -->
      <div style="margin-bottom:24px;">
        <a href="/auth/google/signin" style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:14px 24px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-family:var(--font-lato); font-weight:600; font-size:0.85rem; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; transition:background 0.2s, border-color 0.2s;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </a>
      </div>

      <!-- Already have account? -->
      <div style="text-align:center; font-size:0.7rem; color:var(--ivory-faint);">
        <span>Already have an account? </span><a href="/login2.html" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Sign in</a>
      </div>
    </form>
  </div>

  <footer style="margin-top:28px; text-align:center; font-size:0.7rem; color:var(--ivory-faint); width:100%; position:relative; z-index:10;">
    <span>© 2026 HR Copilot. All rights reserved.</span>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="/privacy-policy" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Privacy Policy</a>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="/terms-of-service" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Terms of Service</a>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="mailto:voovrhr@gmail.com" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Contact</a>
  </footer>

  <script>
    // Toggle password visibility
    document.addEventListener('DOMContentLoaded', function() {
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('passwordInput');
      const toggleConfirm = document.getElementById('toggleConfirmPassword');
      const confirmInput = document.getElementById('confirmPasswordInput');
      const termsCheckbox = document.getElementById('termsCheckbox');
      const signupBtn = document.getElementById('signupBtn');
      const termsError = document.getElementById('termsError');
      const signupForm = document.getElementById('signupForm');

      function updateBtnState() {
        const checked = termsCheckbox.checked;
        const pwd = passwordInput.value;
        const confirm = confirmInput.value;
        const email = document.getElementById('emailInput').value;
        const name = document.getElementById('fullNameInput').value;
        const valid = checked && pwd.length >= 8 && pwd === confirm && email.includes('@') && name.trim().length > 0;
        signupBtn.disabled = !valid;
        signupBtn.style.opacity = valid ? '1' : '0.5';
        signupBtn.style.cursor = valid ? 'pointer' : 'not-allowed';
      }

      termsCheckbox.addEventListener('change', function() {
        termsError.style.display = this.checked ? 'none' : 'block';
        updateBtnState();
      });

      [passwordInput, confirmInput, document.getElementById('emailInput'), document.getElementById('fullNameInput')].forEach(el => el.addEventListener('input', updateBtnState));

      togglePassword.addEventListener('click', function() {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
      });
      toggleConfirm.addEventListener('click', function() {
        const type = confirmInput.type === 'password' ? 'text' : 'password';
        confirmInput.type = type;
      });

      signupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!termsCheckbox.checked) {
          termsError.style.display = 'block';
          return;
        }
        const payload = {
          name: document.getElementById('fullNameInput').value.trim(),
          email: document.getElementById('emailInput').value.trim(),
          password: passwordInput.value
        };
        signupBtn.disabled = true;
        signupBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0110 10" stroke-opacity="1"/></svg> Creating...';
        try {
          const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.ok) {
            // redirect to email verification or dashboard
            window.location.href = data.redirect || '/email-verify.html';
          } else {
            alert(data.message || 'Sign up failed');
          }
        } catch(err) {
          alert('Network error');
        } finally {
          signupBtn.disabled = false;
          signupBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><line x1="9" y1="20" x2="9.01" y2="20"/><line x1="15" y1="20" x2="15.01" y2="20"/></svg> Create Account';
        }
      });
    });
  </script>
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <!-- Cookie consent banner -->
  <script>
    (function() {
      if (localStorage.getItem('cookieConsent') === 'true') return;
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:1000;font-family:var(--font-b);font-size:0.75rem;color:var(--ivory);';
      banner.innerHTML = '<span style="max-width:80%;">We use cookies to improve your experience and keep you signed in. By using this site, you agree to our <a href="/privacy-policy" style="color:var(--amber);text-decoration:underline;">Cookie Policy</a>.</span><button id="acceptCookies" style="background:linear-gradient(135deg,var(--violet),var(--amber));color:var(--void);border:none;padding:8px 16px;border-radius:6px;font-weight:600;text-transform:uppercase;font-size:0.65rem;cursor:pointer;">Accept</button>';
      document.body.appendChild(banner);
      document.getElementById('acceptCookies').addEventListener('click', function() {
        localStorage.setItem('cookieConsent', 'true');
        banner.remove();
      });
    })();
  </script>
</body>
</html>
