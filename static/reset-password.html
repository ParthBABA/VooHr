<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VooVr - Reset Password</title>
  <!-- shared-head -->
  <link rel="stylesheet" href="/style.css">
  <script src="/csrf.js"></script>
  <script src="/ui-feedback.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="/voovr-logo-full.webp" alt="VooVr" class="auth-logo">
    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-subtitle">Choose a new password for your account.</p>
    <form id="resetForm" novalidate>
      <div data-feedback hidden></div>
      <div class="auth-field"><label for="passwordInput">New password</label><input type="password" id="passwordInput" autocomplete="new-password" placeholder="At least 8 characters, with letters and numbers" required></div>
      <div class="auth-field"><label for="confirmInput">Confirm new password</label><input type="password" id="confirmInput" autocomplete="new-password" placeholder="Re-enter your new password" required></div>
      <button type="submit" class="auth-primary">Update password</button>
    </form>
    <p class="auth-subtitle auth-resend"><a href="/signin">← Back to sign in</a></p>
  </main>
  <footer class="site-footer"><span>© 2026 VooVr. All rights reserved.</span><nav aria-label="Legal"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="mailto:voovrhr@gmail.com">Contact</a></nav></footer>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token') || '';
    var form = document.getElementById('resetForm');
    var passwordInput = document.getElementById('passwordInput');
    var confirmInput = document.getElementById('confirmInput');
    var button = form.querySelector('[type="submit"]');
    var fieldClass = 'auth-field';
    var noToken = !token;

    if (noToken) {
      Array.prototype.forEach.call(form.querySelectorAll('.' + fieldClass), function (el) { el.hidden = true; });
      button.hidden = true;
      VooVrUI.show('This reset link is missing or invalid. Please request a new one.', {kind: 'error'});
      return;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (button.disabled) return;
      VooVrUI.clear();
      var password = passwordInput.value;
      var confirm = confirmInput.value;
      if (password.length < 8) return VooVrUI.show('Your new password must be at least 8 characters.');
      if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) return VooVrUI.show('Your new password must include both letters and numbers.');
      if (password !== confirm) return VooVrUI.show('The passwords do not match.');
      button.disabled = true;
      button.textContent = 'Updating…';
      try {
        var response = await fetch('/auth/reset-password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: token, password: password})});
        var data = await response.json();
        if (data.ok) {
          button.hidden = true;
          Array.prototype.forEach.call(form.querySelectorAll('.' + fieldClass), function (el) { el.hidden = true; });
          VooVrUI.show('Your password has been updated. You can now sign in with your new password.', {kind: 'success'});
        } else if (data.error === 'expired') {
          VooVrUI.show('This reset link has expired. Please request a new one.');
        } else if (data.error === 'weak_password') {
          VooVrUI.show('Your new password must be at least 8 characters and include both letters and numbers.');
        } else {
          VooVrUI.show(data.message || 'This reset link is invalid or has already been used. Please request a new one.');
        }
      } catch (error) { VooVrUI.show('Could not reach the server. Check your connection and try again.'); }
      finally { button.disabled = false; button.textContent = 'Update password'; }
    });
  })();
  </script>
</body>
</html>
