<title>HR Copilot - New Session</title>

    var saved = localStorage.getItem('voohr-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<body style="visibility:hidden">
<script>
fetch('/api/me').then(function(res){
  if (!res.ok) { window.location.href = 'signin.html'; return null; }
  return res.json();
}).then(function(data){
  if (!data) return;
  var nameEl = document.getElementById('userName');
  var roleEl = document.getElementById('userRole');
  var avatarEl = document.getElementById('userAvatar');
  if (nameEl) nameEl.textContent = data.name;
  if (roleEl) roleEl.textContent = data.role === 'admin' ? 'HR Admin' : data.role;
  if (avatarEl) avatarEl.textContent = (data.name || 'U').trim().charAt(0).toUpperCase();
  document.body.style.visibility = 'visible';
  loadEmployee();
}).catch(function(){
  window.location.href = 'signin.html';
});

var employeeId = new URLSearchParams(window.location.search).get('employee_id');
var mediaRecorder = null;
var audioChunks = [];
var recordingTimer = null;
var recordingSeconds = 0;
var isRecording = false;

function escHtml(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function loadEmployee() {
  if (!employeeId) {
    document.getElementById('sessionEmployeeName').textContent = 'No employee selected';
    document.getElementById('sessionBreadcrumb').textContent = 'Select an employee from the list';
    return;
  }
  fetch('/api/employees/' + employeeId)
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(emp) {
      if (!emp) return;
      document.getElementById('sessionEmployeeName').textContent = emp.name;
      document.getElementById('sessionBreadcrumb').textContent = emp.employee_id + ' — ' + (emp.department || '');
      var initials = (emp.name || '').trim().split(' ').map(function(s) { return s.charAt(0); }).join('').toUpperCase().slice(0, 2) || '?';
      document.getElementById('sessionAvatar').textContent = initials;
    });
}

function formatTime(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function updateTimer() {
  document.getElementById('recordingTimer').textContent = formatTime(recordingSeconds);
}

function setStatus(text) {
  document.getElementById('recordingStatus').textContent = text;
}

function updateWaveform(active) {
  var bars = document.querySelectorAll('.wf-bar');
  bars.forEach(function(bar, i) {
    if (active) {
      var h = 4 + Math.random() * 28;
      bar.style.height = h + 'px';
      bar.style.animationDelay = (i * 0.1) + 's';
    } else {
      bar.style.height = '4px';
    }
  });
}

function startRecording() {
  if (isRecording) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    isRecording = true;
    audioChunks = [];
    recordingSeconds = 0;
    updateTimer();
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      isRecording = false;
      clearInterval(recordingTimer);
      updateWaveform(false);
      setStatus('Processing audio...');
      document.getElementById('micBtn').classList.remove('recording');
      processAudio();
    };
    mediaRecorder.start(250);
    recordingTimer = setInterval(function() {
      recordingSeconds++;
      updateTimer();
    }, 1000);
    setStatus('Recording... tap to stop');
    document.getElementById('micBtn').classList.add('recording');
    updateWaveform(true);
    document.getElementById('recordIcon').style.display = 'none';
    document.getElementById('stopIcon').style.display = '';
  }).catch(function(err) {
    alert('Microphone access denied. Please allow microphone permissions.');
  });
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function processAudio() {
  if (audioChunks.length === 0) {
    setStatus('No audio recorded');
    document.getElementById('recordIcon').style.display = '';
    document.getElementById('stopIcon').style.display = 'none';
    return;
  }
  var blob = new Blob(audioChunks, { type: 'audio/webm' });
  var formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  fetch('/api/transcribe', {
    method: 'POST',
    body: formData,
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'transcription failed'); });
    return r.json();
  }).then(function(data) {
    document.getElementById('transcriptArea').value = data.text || '';
    updateWordCount();
    setStatus('Transcription ready — edit if needed');
    document.getElementById('recordIcon').style.display = '';
    document.getElementById('stopIcon').style.display = 'none';
    document.getElementById('saveBtn').disabled = false;
  }).catch(function(err) {
    setStatus('Error: ' + err.message);
    document.getElementById('recordIcon').style.display = '';
    document.getElementById('stopIcon').style.display = 'none';
  });
}

function updateWordCount() {
  var text = document.getElementById('transcriptArea').value.trim();
  var count = text ? text.split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = count + ' words';
}

function saveSession() {
  var text = document.getElementById('transcriptArea').value.trim();
  if (!text) {
    alert('Transcript is empty. Record something first.');
    return;
  }
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = 'Saving...';
  fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      employee_id: employeeId,
      raw_text: text,
      edited_text: text,
      duration_seconds: recordingSeconds,
      source: 'voice_dictation',
      recording_device: 'browser',
      recording_type: 'webm',
    }),
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'save failed'); });
    return r.json();
  }).then(function() {
    showToast('Session saved successfully. Ready for AI Sync.');
    setTimeout(function() {
      window.location.href = 'dashboard.html';
    }, 2000);
  }).catch(function(err) {
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').textContent = 'Save Session';
    alert('Failed to save: ' + err.message);
  });
}

function discardSession() {
  if (document.getElementById('transcriptArea').value.trim()) {
    if (!confirm('Discard this recording?')) return;
  }
  window.location.href = 'dashboard.html';
}

function showToast(msg) {
  var toast = document.createElement('div');
  toast.className = 'toast-notification';
  toast.textContent = msg;
  document.body.appendChild(toast);
  gsap.set(toast, { y: 60, opacity: 0 });
  gsap.to(toast, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' });
  setTimeout(function() {
    gsap.to(toast, { y: 60, opacity: 0, duration: 0.3, ease: 'power3.in', onComplete: function() { toast.remove(); }});
  }, 4000);
}

document.addEventListener('DOMContentLoaded', function() {
  var backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', function(e) { e.preventDefault(); discardSession(); });
  document.getElementById('micBtn').addEventListener('click', toggleRecording);
  document.getElementById('transcriptArea').addEventListener('input', updateWordCount);
  document.getElementById('saveBtn').addEventListener('click', saveSession);
  document.getElementById('discardBtn').addEventListener('click', discardSession);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') discardSession();
    if (e.key === ' ' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      toggleRecording();
    }
  });
});
</script>

}
.mic-btn.recording {

}
.mic-btn svg {

}
@keyframes micPulse {

}
.timer {

  font-size: 2rem;
  font-weight: 700;
  color: var(--ivory);
  margin-top: 1rem;
  letter-spacing: 0.05em;
}
.status-text {
  font-family: var(--font-m);

  letter-spacing: 0.12em;

}
.waveform {

  height: 32px;
  margin-top: 1rem;
}
.wf-bar {
  width: 4px;

}
.transcript-section {

}
.transcript-area {

  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  font-family: var(--font-b);
  font-size: 0.85rem;
  color: var(--ivory);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}
.transcript-area:focus {

}
.transcript-meta {
  display: flex;
  justify-content: flex-end;

}

  display: flex;

.dictation-actions .btn {
