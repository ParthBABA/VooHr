<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Copilot - Meeting Tracker</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('voohr-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,400,600,700&f[]=cabinet-grotesk@300,400,500,700,800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .gsap-hidden { opacity: 0 !important; }

  /* ── Page-scoped design tokens (native VooHr palette) ── */
  .mt-root {
    --mt-violet: #8B5CF6;
    --mt-teal: #34D399;
    --mt-amber: #FBBF24;
    --mt-red: #F87171;
    --mt-cyan: #60A5FA;
  }

  /* ── Toolbar / filters ── */
  .mt-toolbar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:1.6rem;}
  .mt-count{font-family:var(--font-m);font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ivory-faint);margin-right:auto;}
  .mt-count b{color:var(--ivory);font-weight:700;}
  .mt-pill{padding:0.5rem 0.95rem;background:var(--surface);border:1px solid var(--border);color:var(--ivory-dim);font-family:var(--font-m);font-size:0.72rem;letter-spacing:0.04em;cursor:pointer;border-radius:6px;transition:all 0.2s;white-space:nowrap;}
  .mt-pill:hover{border-color:var(--border-lit);color:var(--ivory);}
  .mt-pill.active{background:linear-gradient(135deg,var(--mt-violet),var(--mt-amber));border-color:transparent;color:#fff;}
  .mt-pill .mt-pill-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:0.4rem;vertical-align:middle;}
  .mt-search{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.8rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;min-width:200px;max-width:280px;transition:border-color 0.2s;}
  .mt-search:focus-within{border-color:var(--border-lit);}
  .mt-search svg{opacity:0.45;flex-shrink:0;}
  .mt-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ivory);font-family:var(--font-m);font-size:0.75rem;}
  .mt-search input::placeholder{color:var(--ivory-faint);}

  /* ── Summary metrics ── */
  .mt-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:0.9rem;margin-bottom:2rem;}
  .mt-metric{background:var(--ink);border:1px solid var(--border);padding:1.1rem 1.2rem;position:relative;overflow:hidden;transition:all 0.4s;border-radius:8px;}
  .mt-metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform 0.4s;}
  .mt-metric:hover{border-color:var(--border-lit);}
  .mt-metric:hover::before{transform:scaleX(1);}
  .mt-metric .mt-mval{font-family:var(--font-lato);font-weight:900;font-size:clamp(1.4rem,2.2vw,1.9rem);letter-spacing:-0.02em;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .mt-metric .mt-mlabel{font-family:var(--font-lato);font-weight:700;font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ivory-dim);margin-top:0.55rem;}
  .mt-metric.m-accent0{--accent:var(--mt-violet);--accent2:var(--mt-cyan);}
  .mt-metric.m-accent1{--accent:var(--mt-amber);--accent2:#F97316;}
  .mt-metric.m-accent2{--accent:var(--mt-teal);--accent2:#22D3EE;}
  .mt-metric.m-accent3{--accent:var(--mt-red);--accent2:#FB7185;}
  .mt-metric.m-accent4{--accent:var(--mt-cyan);--accent2:#A78BFA;}
  .mt-metric.m-accent5{--accent:#F97316;--accent2:#FBBF24;}

  /* ── Section headers ── */
  .mt-sectionhead{display:flex;align-items:center;gap:0.8rem;margin:0 0 1rem;}
  .mt-sectionhead .mt-eyebrow{font-family:var(--font-m);font-size:0.62rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--ivory-dim);}
  .mt-sectionhead .mt-rule{flex:1;height:1px;background:var(--border);}
  .mt-sectionhead .mt-count-chip{font-family:var(--font-m);font-size:0.66rem;color:var(--ivory-faint);padding:0.2rem 0.6rem;border:1px solid var(--border);border-radius:20px;}

  /* ── Meeting cards ── */
  .mt-grid{display:grid;grid-template-columns:1fr;gap:0.9rem;margin:0 0 2.6rem;}
  .mt-card{background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:0.85rem;position:relative;overflow:hidden;transition:all 0.3s;}
  .mt-card:hover{border-color:var(--border-lit);transform:translateY(-2px);}
  .mt-card-top{display:flex;align-items:center;gap:0.85rem;}
  .mt-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-lato);font-weight:800;font-size:0.9rem;color:var(--void);background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .mt-who{flex:1;min-width:0;}
  .mt-who .mt-name{font-family:var(--font-lato);font-weight:700;font-size:0.98rem;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mt-who .mt-role{font-family:var(--font-m);font-size:0.68rem;color:var(--ivory-faint);letter-spacing:0.04em;margin-top:0.15rem;}
  .mt-status{flex-shrink:0;font-family:var(--font-m);font-weight:700;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.28rem 0.7rem;border-radius:20px;display:inline-flex;align-items:center;gap:0.35rem;}
  .mt-status .dot{width:6px;height:6px;border-radius:50%;}
  .mt-status--today{color:var(--mt-amber);background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.35);}
  .mt-status--today .dot{background:var(--mt-amber);}
  .mt-status--overdue{color:var(--mt-red);background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.35);}
  .mt-status--overdue .dot{background:var(--mt-red);}
  .mt-status--upcoming{color:var(--mt-teal);background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);}
  .mt-status--upcoming .dot{background:var(--mt-teal);}
  .mt-status--follow{color:var(--mt-violet);background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.35);}
  .mt-status--follow .dot{background:var(--mt-violet);}
  .mt-body{display:flex;flex-direction:column;gap:0.65rem;}
  .mt-meta{display:flex;flex-wrap:wrap;gap:0.5rem 1.2rem;font-family:var(--font-m);font-size:0.72rem;color:var(--ivory-dim);}
  .mt-meta span{display:inline-flex;align-items:center;gap:0.4rem;}
  .mt-meta svg{width:13px;height:13px;opacity:0.55;}
  .mt-topic{font-size:0.8rem;color:var(--ivory);line-height:1.5;}
  .mt-topic b{color:var(--ivory);}
  .mt-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.6rem;}
  .mt-cell{background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:0.7rem 0.85rem;min-width:0;}
  .mt-cell .mt-celllabel{font-family:var(--font-m);font-size:0.58rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--mt-cyan);margin-bottom:0.4rem;display:flex;align-items:center;gap:0.35rem;}
  .mt-cell .mt-celllabel svg{width:12px;height:12px;opacity:0.7;}
  .mt-cell .mt-cellline{font-family:var(--font-lato);font-weight:600;font-size:0.8rem;color:var(--ivory);line-height:1.4;}
  .mt-cell .mt-cellline.is-owner{color:var(--mt-amber);}
  .mt-cell .mt-cellline.is-date{color:var(--mt-teal);}
  .mt-cell.is-promise{border-left:2px solid var(--mt-amber);}
  .mt-cell.is-reminder{border-left:2px solid var(--mt-red);}
  .mt-cell.is-follow{border-left:2px solid var(--mt-violet);}
  .mt-follow{display:flex;align-items:center;justify-content:space-between;gap:0.8rem;flex-wrap:wrap;}
  .mt-folllabel{font-family:var(--font-m);font-size:0.62rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--mt-violet);display:inline-flex;align-items:center;gap:0.4rem;}
  .mt-folllabel svg{width:12px;height:12px;}
  .mt-fover{font-family:var(--font-m);font-size:0.66rem;color:var(--mt-red);}
  .mt-footer{display:flex;align-items:center;justify-content:flex-end;gap:0.6rem;padding-top:0.75rem;border-top:1px solid var(--border);}
  .mt-link{font-family:var(--font-m);font-size:0.64rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--mt-cyan);text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;padding:0.4rem 0.8rem;border:1px solid var(--border);border-radius:6px;transition:all 0.2s;}
  .mt-link:hover{color:var(--void);background:var(--mt-cyan);border-color:var(--mt-cyan);}
  .mt-link svg{width:13px;height:13px;}

  .mt-empty{text-align:center;padding:3.5rem 1rem;border:1px dashed var(--border);border-radius:10px;color:var(--ivory-faint);font-family:var(--font-m);font-size:0.78rem;margin-bottom:2.6rem;}
  .mt-empty svg{width:38px;height:38px;opacity:0.4;margin-bottom:0.8rem;}

  /* ── Responsive ── */
  @media (max-width: 1200px){ .mt-metrics{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 640px){
    .mt-metrics{grid-template-columns:repeat(2,1fr);}
    .mt-toolbar{gap:0.5rem;}
    .mt-search{min-width:100%;max-width:100%;order:99;}
  }

  /* ── prefer reduced motion ── */
  @media (prefers-reduced-motion: reduce){
    .mt-card{transition:none;transform:none !important;}
    .mt-metric{transition:none;}
  }

  /* ── Loading / error / notice states ── */
  .mt-state{padding:3.5rem 1.5rem;text-align:center;border:1px solid var(--border);border-radius:10px;font-family:var(--font-m);font-size:0.78rem;color:var(--ivory-dim);margin-bottom:2rem;}
  .mt-state svg{width:36px;height:36px;opacity:0.4;margin-bottom:0.8rem;}
  .mt-state-title{font-family:var(--font-lato);font-weight:700;font-size:0.85rem;color:var(--ivory);margin-bottom:0.4rem;text-transform:none;letter-spacing:0;}
  .mt-state-sub{font-size:0.7rem;color:var(--ivory-faint);margin-bottom:1rem;text-transform:none;letter-spacing:0;}
  .mt-spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--mt-violet);border-radius:50%;margin:0 auto 0.9rem;animation:mtSpin 0.8s linear infinite;}
  @keyframes mtSpin{to{transform:rotate(360deg);}}
  .mt-retry{cursor:pointer;}

  /* ── Detail modal (native, additive) ── */
  .mt-modal-overlay{position:fixed;inset:0;background:rgba(6,8,12,0.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.25s;}
  .mt-modal-overlay.active{opacity:1;pointer-events:all;}
  .mt-modal{background:var(--ink);border:1px solid var(--border);border-radius:12px;width:100%;max-width:640px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
  .mt-modal-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem 1.4rem;border-bottom:1px solid var(--border);}
  .mt-modal-title{font-family:var(--font-lato);font-weight:700;font-size:1.05rem;color:var(--ivory);}
  .mt-modal-sub{font-family:var(--font-m);font-size:0.66rem;color:var(--ivory-faint);margin-top:0.25rem;text-transform:none;letter-spacing:0;}
  .mt-modal-x{background:transparent;border:1px solid var(--border);color:var(--ivory-dim);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:1.05rem;line-height:1;}
  .mt-modal-x:hover{color:var(--ivory);border-color:var(--border-lit);}
  .mt-modal-body{padding:1.4rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.2rem;}
  .mt-d{display:flex;flex-direction:column;gap:0.9rem;}
  .mt-dtitle{font-family:var(--font-m);font-size:0.6rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--mt-cyan);}
  .mt-drow{font-size:0.82rem;color:var(--ivory-dim);line-height:1.6;}
  .mt-drow b{color:var(--ivory);}
  .mt-item{display:flex;gap:0.7rem;align-items:flex-start;padding:0.7rem 0.85rem;background:var(--elevated);border:1px solid var(--border);border-radius:8px;}
  .mt-item .mt-itxt{flex:1;min-width:0;font-size:0.8rem;color:var(--ivory);line-height:1.5;word-break:break-word;}
  .mt-item .mt-idue{font-family:var(--font-m);font-size:0.62rem;color:var(--ivory-faint);white-space:nowrap;margin-top:2px;}
  .mt-badge{flex-shrink:0;font-family:var(--font-m);font-weight:700;font-size:0.56rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.22rem 0.55rem;border-radius:20px;white-space:nowrap;}
  .mt-badge--saved{color:var(--mt-teal);background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);}
  .mt-badge--used{color:var(--mt-cyan);background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.35);}
  .mt-badge--pending{color:var(--mt-amber);background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.35);}
  .mt-badge--completed{color:var(--mt-teal);background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);}
  .mt-badge--overdue{color:var(--mt-red);background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.35);}
  .mt-none{font-family:var(--font-m);font-size:0.72rem;color:var(--ivory-faint);font-style:italic;}
  .mt-split{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;}
  @media (max-width:560px){ .mt-split{grid-template-columns:1fr;} }

  /* ── Schedule form ── */
  .mt-form{display:flex;flex-direction:column;gap:1rem;}
  .mt-form .form-label{margin-bottom:0.4rem;}
  .mt-field{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--ivory);font-family:var(--font-lato);font-size:0.85rem;padding:0.6rem 0.75rem;outline:none;color-scheme:dark;}
  .mt-field:focus{border-color:var(--border-lit);}
  select.mt-field{appearance:auto;}
  .mt-formerr{font-family:var(--font-m);font-size:0.7rem;color:var(--mt-red);}

  /* ── Avatar accent palette (deterministic per person) ── */
  .mt-accents{display:none;}
</style>
</head>
<body>
<div style="display:flex;min-height:100vh;">

  <!-- SIDEBAR -->
  <nav class="sidebar icon-only gsap-hidden">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-mark">HR</span>
        <span>HR Copilot</span>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Command Center</div>
      <a href="/dashboard" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/sync" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/></svg>
        <span>Sync</span>
      </a>
      <a href="/sync/room" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        <span>Sync Room</span>
      </a>
      <a href="/meeting-tracker" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><circle cx="8" cy="15" r="1"/><circle cx="12" cy="18" r="1"/><circle cx="16" cy="18" r="1"/><circle cx="8" cy="18" r="1"/></svg>
        <span>Meeting Tracker</span>
      </a>
      <a href="/settings" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">User</div>
        <div class="user-role" id="userRole">Admin</div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-bar-left">
        <div>
          <div class="page-title" id="pageTitle">Meeting Tracker</div>
          <div class="breadcrumb" id="breadcrumbRow"><span>Dashboard</span> / <span>Meeting Tracker</span></div>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="btn btn-gradient btn-sm" id="syncRoomBtn" title="Open Sync Room">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          Sync Room
        </button>
        <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle light/dark theme">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div class="content-area mt-root" id="contentArea">

      <!-- SUMMARY METRICS -->
      <div class="mt-metrics" id="mtMetrics"></div>

      <!-- TOOLBAR -->
      <div class="mt-toolbar">
        <div class="mt-count">Showing <b id="mtShownCount">0</b> of <b id="mtTotalCount">0</b> conversations</div>
        <button class="mt-pill active" data-filter="all">All</button>
        <button class="mt-pill" data-filter="today"><span class="mt-pill-dot" style="background:var(--mt-amber)"></span>Today</button>
        <button class="mt-pill" data-filter="thisweek"><span class="mt-pill-dot" style="background:var(--mt-teal)"></span>This Week</button>
        <button class="mt-pill" data-filter="followup"><span class="mt-pill-dot" style="background:var(--mt-violet)"></span>Follow-ups</button>
        <button class="mt-pill" data-filter="overdue"><span class="mt-pill-dot" style="background:var(--mt-red)"></span>Overdue</button>
        <div class="mt-search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="mtSearch" placeholder="Search people or topics…">
        </div>
        <button class="btn btn-gradient btn-sm" id="scheduleMeetingBtn" title="Schedule a 1:1 meeting">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Schedule Meeting
        </button>
      </div>

      <!-- TODAY'S MEETINGS -->
      <div class="mt-sectionhead" id="hdrToday">
        <span class="mt-eyebrow">Today's Meetings</span>
        <span class="mt-rule"></span>
        <span class="mt-count-chip" id="chipToday">0</span>
      </div>
      <div class="mt-grid" id="mtToday"></div>

      <!-- UPCOMING -->
      <div class="mt-sectionhead" id="hdrUpcoming">
        <span class="mt-eyebrow">Upcoming Conversations</span>
        <span class="mt-rule"></span>
        <span class="mt-count-chip" id="chipUpcoming">0</span>
      </div>
      <div class="mt-grid" id="mtUpcoming"></div>

      <!-- FOLLOW-UPS -->
      <div class="mt-sectionhead" id="hdrFollow">
        <span class="mt-eyebrow">Follow-ups &amp; Promises</span>
        <span class="mt-rule"></span>
        <span class="mt-count-chip" id="chipFollow">0</span>
      </div>
      <div class="mt-grid" id="mtFollow"></div>

      <!-- LOADING / ERROR STATE -->
      <div id="mtStateBox"></div>

      <div class="mt-empty" id="mtEmpty" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <div>No conversations match your filter.</div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/csrf.js"></script>
<div id="mtModalOverlay" class="mt-modal-overlay"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   MEETING TRACKER — Phase 2: real backend data.
   Consumes GET /api/meetings/dashboard (one call) for the board and
   lazily loads conversation memory + meeting detail via dedicated
   endpoints. Visual design (.mt-*) is preserved from Phase 1.
   ═══════════════════════════════════════════════════════════════ */
var mtData = null;          // raw dashboard payload
var mtPeople = [];          // rendered people (each = one card)
var mtByEmp = {};           // employee_id -> person (for detail lookups)
var mtEmployees = [];       // active employees (for scheduling)
var mtFilter = 'all';
var mtQuery = '';

// ── Small DOM helpers ──
function escHtml(str) {
  if (str === null || str === undefined) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(String(str)));
  return d.innerHTML;
}
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtTime(d) {
  var h = d.getHours(), m = d.getMinutes(), am = h < 12 ? 'AM' : 'PM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + pad(m) + ' ' + am;
}
function fmtDate(d) {
  return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
}
function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function isThisWeek(d) {
  var now = new Date();
  var mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate() - now.getDay() + 1);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return d >= mon && d <= sun;
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).map(function(w){ return w.charAt(0); }).join('').slice(0,2).toUpperCase() || '?';
}
// Deterministic accent per employee id (stable across renders)
var ACCENTS = [
  ['#8B5CF6', '#60A5FA'], ['#FBBF24', '#F97316'], ['#34D399', '#22D3EE'],
  ['#F87171', '#FB7185'], ['#60A5FA', '#A78BFA'], ['#F97316', '#FBBF24'],
  ['#34D399', '#8B5CF6'], ['#A78BFA', '#F472B6'], ['#22D3EE', '#34D399'],
  ['#FB7185', '#FBBF24']
];
function accentFor(id) {
  var hash = 0;
  var s = String(id || '');
  for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return ACCENTS[hash % ACCENTS.length];
}

// ── Section (status) resolution for a person ──
function personSection(p) {
  var nm = p.next_meeting;
  if (nm && nm.scheduled_at && isSameDay(new Date(nm.scheduled_at), new Date())) return 'today';
  if (p.counts.overdue_followups > 0) return 'overdue';
  if (p.counts.pending_followups > 0) return 'follow';
  if (nm && nm.scheduled_at) return isThisWeek(new Date(nm.scheduled_at)) ? 'thisweek' : 'nextweek';
  return 'today';
}

// ── Card renderers ──
function mdAvatar(p) {
  var acc = accentFor(p.id);
  return '<div class="mt-avatar" style="--accent:' + acc[0] + ';--accent2:' + acc[1] + ';">' + escHtml(initials(p.employee.name)) + '</div>';
}

function mdStatus(section) {
  var map = { today: 'Today', upcoming: 'Upcoming', follow: 'Follow-up', overdue: 'Overdue' };
  var cls = {
    today: 'mt-status--today', upcoming: 'mt-status--upcoming',
    follow: 'mt-status--follow', overdue: 'mt-status--overdue'
  }[section === 'thisweek' || section === 'nextweek' ? 'upcoming' : section] || 'mt-status--upcoming';
  var label = map[section === 'thisweek' || section === 'nextweek' ? 'upcoming' : section] || 'Upcoming';
  return '<span class="mt-status ' + cls + '"><span class="dot"></span>' + label + '</span>';
}

function mdCell(label, value, cls, isOwner, svgPath) {
  var outer = cls || '';
  var line = '<div class="mt-cellline' + (isOwner ? ' is-owner' : '') + '">' + escHtml(value || '—') + '</div>';
  if (label === 'Promise') outer += ' is-promise';
  if (label === 'Follow-up') outer += ' is-follow';
  var svg = svgPath || '';
  return '<div class="mt-cell ' + outer + '"><div class="mt-celllabel">' + svg + escHtml(label) + '</div>' + line + '</div>';
}

function employerCell(p, section) {
  var name = p.employee.name;
  var role = p.employee.position || '';
  var when = p.next_meeting && p.next_meeting.scheduled_at ? new Date(p.next_meeting.scheduled_at) : null;
  var timeline, dateStr;
  if (section === 'today' && when) { timeline = 'Today'; dateStr = 'Today \u00b7 ' + fmtTime(when); }
  else if (section === 'thisweek' && when) {
    timeline = 'This Week';
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    dateStr = days[when.getDay()] + ' \u00b7 ' + fmtTime(when);
  }
  else if (section === 'nextweek' && when) {
    timeline = 'Next Week';
    dateStr = fmtDate(when) + ' \u00b7 ' + fmtTime(when);
  }
  else if (section === 'overdue') { timeline = 'Overdue'; dateStr = p.counts.overdue_followups + ' overdue item(s)'; }
  else { timeline = 'Follow-up'; dateStr = p.counts.pending_followups + ' follow-up(s)'; }
  return { name: name, role: role, timeline: timeline, dateStr: dateStr, when: when };
}

function mdCard(p) {
  var section = personSection(p);
  var info = employerCell(p, section);
  var isOwnerSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
  var mgrSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
  var calSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  var promiseSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
  var followSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 6v6l4 2"/></svg>';

  // Promises cell: factual open commitments
  var commitments = (p.open_items || []).filter(function(o){ return o.type === 'COMMITMENT'; });
  var promises = commitments.length
    ? commitments.map(function(c){ return '<div class="mt-cellline is-owner">' + escHtml(c.content) + '</div>'; }).join('')
    : '<div class="mt-cellline">—</div>';

  // Follow row: next due open follow-up
  var followups = (p.open_items || []).filter(function(o){ return o.type === 'FOLLOW_UP'; });
  var follow = '';
  if (followups.length) {
    var first = followups[0];
    var due = first.due_at ? 'Due ' + fmtDate(new Date(first.due_at)) : 'No due date';
    if (first.status === 'OVERDUE') due = 'Overdue \u00b7 ' + (first.due_at ? fmtDate(new Date(first.due_at)) : '');
    follow =
      '<div class="mt-follow">' +
        '<span class="mt-folllabel">' + followSvg + 'Follow-up</span>' +
        '<span class="mt-fover">' + escHtml(first.content) + ' \u2014 ' + due + '</span>' +
      '</div>';
  } else if (section === 'follow' || section === 'overdue') {
    follow =
      '<div class="mt-follow">' +
        '<span class="mt-folllabel">' + followSvg + 'Follow-up</span>' +
        '<span class="mt-fover">' + escHtml(info.dateStr) + '</span>' +
      '</div>';
  }

  var topic = (p.next_meeting && p.next_meeting.title)
    ? p.next_meeting.title
    : ((followups.length ? followups : commitments).length
        ? ((followups[0] || commitments[0]).content)
        : 'Action items \u2014 no upcoming meeting scheduled');

  var prevLink = '';
  if (p.previous_session && p.previous_session.session_id) {
    prevLink = '<a class="mt-link" href="javascript:void(0)" onclick="mtOpenPrevious(\'' + escHtml(p.id) + '\')" title="View previous session context"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>Previous Context</a>';
  }

  return (
    '<div class="mt-card" data-seen="' + escHtml(p.id) + '">' +
      '<div class="mt-card-top">' +
        mdAvatar(p) +
        '<div class="mt-who"><div class="mt-name">' + escHtml(info.name) + '</div><div class="mt-role">' + escHtml(info.role) + '</div></div>' +
        mdStatus(section) +
      '</div>' +
      '<div class="mt-body">' +
        '<div class="mt-meta">' +
          '<span>' + calSvg + escHtml(info.dateStr) + '</span>' +
          '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + escHtml(info.name) + '</span>' +
        '</div>' +
        '<div class="mt-topic">' + escHtml(topic) + '</div>' +
        '<div class="mt-board">' +
          '<div class="mt-cell is-owner"><div class="mt-celllabel">' + isOwnerSvg + 'Owner</div><div class="mt-cellline is-owner">' + escHtml(info.name) + '</div></div>' +
          '<div class="mt-cell"><div class="mt-celllabel">' + mgrSvg + 'Manager</div><div class="mt-cellline">You</div></div>' +
          '<div class="mt-cell"><div class="mt-celllabel">' + calSvg + 'Timeline</div><div class="mt-cellline is-date">' + escHtml(info.timeline) + '</div></div>' +
          '<div class="mt-cell is-promise"><div class="mt-celllabel">' + promiseSvg + 'Promises</div>' + promises + '</div>' +
          '<div class="mt-cell is-follow"><div class="mt-celllabel">' + followSvg + 'Open Follow-ups</div><div class="mt-cellline">' + escHtml(followups.length) + '</div></div>' +
        '</div>' +
        follow +
        '<div class="mt-footer">' +
          '<a class="mt-link" href="javascript:void(0)" onclick="mtOpenDetail(\'' + escHtml(p.id) + '\')" title="View full meeting &amp; recorded context"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>View Meeting</a>' +
          prevLink +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function matchesItem(p) {
  var section = personSection(p);
  if (mtFilter === 'today' && section !== 'today') return false;
  if (mtFilter === 'thisweek' && section !== 'today' && section !== 'thisweek') return false;
  if (mtFilter === 'followup' && section !== 'follow' && section !== 'overdue') return false;
  if (mtFilter === 'overdue' && section !== 'overdue') return false;
  if (mtQuery) {
    var hay = (p.employee.name + ' ' + (p.employee.position || '') + ' ' + topicFor(p) + ' ' + (p.open_items || []).map(function(o){ return o.content; }).join(' ')).toLowerCase();
    if (hay.indexOf(mtQuery) === -1) return false;
  }
  return true;
}

function topicFor(p) {
  if (p.next_meeting && p.next_meeting.title) return p.next_meeting.title;
  var it = (p.open_items || [])[0];
  return it ? it.content : '';
}

function renderMetrics() {
  var c = mtData ? mtData.counters : { today: 0, this_week: 0, pending_followups: 0, pending_commitments: 0 };
  var overdue = mtPeople.reduce(function(n, p){ return n + p.counts.overdue_followups; }, 0);
  var cells = [
    { v: c.today, l: 'Today', a: 'm-accent0' },
    { v: c.this_week, l: 'This Week', a: 'm-accent1' },
    { v: c.pending_followups, l: 'Follow-ups', a: 'm-accent2' },
    { v: c.pending_commitments, l: 'Promises', a: 'm-accent4' },
    { v: overdue, l: 'Overdue', a: 'm-accent3' }
  ];
  $('mtMetrics').innerHTML = cells.map(function(ce){
    return '<div class="mt-metric ' + ce.a + '"><div class="mt-mval">' + ce.v + '</div><div class="mt-mlabel">' + ce.l + '</div></div>';
  }).join('');
}

function render() {
  var filtered = mtPeople.filter(matchesItem);
  var today = filtered.filter(function(p){ return personSection(p) === 'today'; });
  var upcoming = filtered.filter(function(p){ var s = personSection(p); return s === 'thisweek' || s === 'nextweek'; });
  var follow = filtered.filter(function(p){ var s = personSection(p); return s === 'follow' || s === 'overdue'; });

  $('mtToday').innerHTML = today.map(mdCard).join('');
  $('mtUpcoming').innerHTML = upcoming.map(mdCard).join('');
  $('mtFollow').innerHTML = follow.map(mdCard).join('');
  $('chipToday').textContent = today.length;
  $('chipUpcoming').textContent = upcoming.length;
  $('chipFollow').textContent = follow.length;
  $('mtShownCount').textContent = filtered.length;
  $('mtTotalCount').textContent = mtPeople.length;

  var isEmpty = today.length === 0 && upcoming.length === 0 && follow.length === 0;
  $('mtEmpty').style.display = isEmpty ? 'block' : 'none';
  $('hdrToday').style.display = today.length ? '' : 'none';
  $('hdrUpcoming').style.display = upcoming.length ? '' : 'none';
  $('hdrFollow').style.display = follow.length ? '' : 'none';

  animateCards();
}

function animateCards() {
  if (!$('contentArea')) return;
  var re = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (re) return;
  var cards = document.querySelectorAll('.mt-card');
  if (window.gsap && cards.length) {
    gsap.set(cards, { opacity: 0, y: 12 });
    gsap.to(cards, { opacity: 1, y: 0, duration: 0.35, stagger: 0.04, ease: 'power3.out' });
  }
}

// ── Data loading + states ──
function showLoading() {
  $('mtMetrics').innerHTML = '';
  $('hdrToday').style.display = 'none';
  $('hdrUpcoming').style.display = 'none';
  $('hdrFollow').style.display = 'none';
  $('mtEmpty').style.display = 'none';
  var box = $('mtStateBox');
  box.style.display = 'block';
  box.innerHTML =
    '<div class="mt-state"><div class="mt-spinner"></div><div class="mt-state-title">Loading your meeting board</div><div class="mt-state-sub">Fetching real employees, meetings &amp; conversation memory</div></div>';
}
function showError(msg) {
  var box = $('mtStateBox');
  box.style.display = 'block';
  box.innerHTML =
    '<div class="mt-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
    '<div class="mt-state-title">Couldn\u2019t load the meeting board</div>' +
    '<div class="mt-state-sub">' + escHtml(msg || 'Please try again.') + '</div>' +
    '<button class="btn btn-outline btn-sm mt-retry" type="button">Retry</button></div>';
  box.querySelector('.mt-retry').addEventListener('click', loadData);
}
function hideState() {
  $('mtStateBox').style.display = 'none';
  $('mtStateBox').innerHTML = '';
}

function loadData() {
  showLoading();
  fetch('/api/meetings/dashboard')
    .then(function(r){ if (!r.ok) throw new Error('Request failed (' + r.status + ')'); return r.json(); })
    .then(function(data) {
      mtData = data;
      mtEmployees = data.employees || [];
      mtPeople = data.people || [];
      mtByEmp = {};
      mtPeople.forEach(function(p){ mtByEmp[p.id] = p; });
      hideState();
      renderMetrics();
      render();
      if (!mtPeople.length) {
        $('mtEmpty').style.display = 'block';
        $('mtToday').innerHTML = ''; $('mtUpcoming').innerHTML = ''; $('mtFollow').innerHTML = '';
      }
    })
    .catch(function(err) {
      console.error('Meeting dashboard load failed:', err);
      showError(err.message);
    });
}

// ── Modal machinery ──
function openModal(html) {
  var ov = $('mtModalOverlay');
  if (!ov) return;
  ov.innerHTML = html;
  ov.classList.add('active');
  var x = ov.querySelector('.mt-modal-x');
  if (x) x.addEventListener('click', closeModal);
  ov.addEventListener('click', function(ev){ if (ev.target === ov) closeModal(); });
  document.addEventListener('keydown', mtEsc);
}
function closeModal() {
  var ov = $('mtModalOverlay');
  if (!ov) return;
  ov.classList.remove('active');
  document.removeEventListener('keydown', mtEsc);
}
function mtEsc(ev) { if (ev.key === 'Escape') closeModal(); }

function modalShell(title, sub) {
  return (
    '<div class="mt-modal">' +
      '<div class="mt-modal-head"><div><div class="mt-modal-title">' + title + '</div>' + (sub ? '<div class="mt-modal-sub">' + sub + '</div>' : '') + '</div>' +
      '<button class="mt-modal-x" type="button" title="Close">&times;</button></div>' +
      '<div class="mt-modal-body">' + '<div class="mt-state" style="margin:0;"><div class="mt-spinner"></div></div>' + '</div>' +
    '</div>'
  );
}
function fillModalBody(html) {
  var body = document.querySelector('#mtModalOverlay .mt-modal-body');
  if (body) body.innerHTML = html;
}

function badgeCls(status, type) {
  if (type === 'NOTE') return 'mt-badge--saved';
  var s = (status || '').toUpperCase();
  if (s === 'USED') return 'mt-badge--used';
  if (s === 'COMPLETED') return 'mt-badge--completed';
  if (s === 'OVERDUE') return 'mt-badge--overdue';
  return 'mt-badge--pending';
}
function badgeLabel(status) {
  var s = (status || '').toUpperCase();
  return { SAVED: 'Saved', USED: 'Used', PENDING: 'Pending', COMPLETED: 'Completed', OVERDUE: 'Overdue' }[s] || s;
}

function memoryBlock(title, items, emptyText) {
  if (!items || !items.length) return '<div class="mt-d"><div class="mt-dtitle">' + title + '</div><div class="mt-none">' + emptyText + '</div></div>';
  var rows = items.map(function(it){
    return '<div class="mt-item"><div class="mt-itxt">' + escHtml(it.content) + '</div>' +
      '<div class="mt-idue">' + (it.due_at ? 'Due ' + fmtDate(new Date(it.due_at)) : '') + '</div>' +
      '<span class="mt-badge ' + badgeCls(it.status, it.type) + '">' + badgeLabel(it.status) + '</span></div>';
  }).join('');
  return '<div class="mt-d"><div class="mt-dtitle">' + title + '</div>' + rows + '</div>';
}

// ── View Meeting (current) detail ──
function mtOpenDetail(eid) {
  var p = mtByEmp[eid];
  if (!p) return;
  var name = p.employee.name, role = p.employee.position || 'HR';
  var sub = '';
  if (p.next_meeting) {
    sub = (p.next_meeting.title || 'Meeting') + ' \u00b7 ' + (p.next_meeting.scheduled_at ? fmtDate(new Date(p.next_meeting.scheduled_at)) + ' ' + fmtTime(new Date(p.next_meeting.scheduled_at)) : '');
  } else {
    sub = 'No upcoming meeting scheduled';
  }
  openModal(modalShell(escHtml(name) + '<span style="color:var(--ivory-faint);font-weight:400;"> &mdash; ' + escHtml(role) + '</span>', escHtml(sub)));

  var bodyHtml =
    '<div class="mt-split">' +
      '<div class="mt-d"><div class="mt-dtitle">Overview</div><div class="mt-drow"><b>Person:</b> ' + escHtml(name) + '</div>' +
      '<div class="mt-drow"><b>Role:</b> ' + escHtml(role) + '</div>' +
      '<div class="mt-drow"><b>Next meeting:</b> ' + escHtml(sub) + '</div></div>' +
      '<div class="mt-d"><div class="mt-dtitle">Recorded this sync track</div>' +
      '<div class="mt-drow"><b>Open commitments:</b> ' + p.counts.pending_commitments + '</div>' +
      '<div class="mt-drow"><b>Open follow-ups:</b> ' + p.counts.pending_followups + '</div>' +
      '<div class="mt-drow"><b>Openers used:</b> ' + p.counts.openers_used + '</div></div>' +
    '</div>' +
    '<div class="mt-d"><div class="mt-dtitle">Conversation memory</div><div class="mt-none">Loading recorded items\u2026</div></div>';
  fillModalBody(bodyHtml);

  fetch('/api/conversation-memory?employee_id=' + encodeURIComponent(eid))
    .then(function(r){ if (!r.ok) throw new Error('Failed (' + r.status + ')'); return r.json(); })
    .then(function(data) {
      var items = data.items || [];
      var used = items.filter(function(m){ return m.type === 'OPENER' || m.type === 'QUESTION'; });
      var commits = items.filter(function(m){ return m.type === 'COMMITMENT'; });
      var follows = items.filter(function(m){ return m.type === 'FOLLOW_UP'; });
      var notes = items.filter(function(m){ return m.type === 'NOTE'; });
      var html =
        memoryBlock('Openers &amp; Questions', used, 'No openers or questions recorded for this person.') +
        memoryBlock('Commitments', commits, 'No commitments recorded.') +
        memoryBlock('Follow-ups', follows, 'No follow-ups recorded.') +
        memoryBlock('Notes', notes, 'No notes recorded.');
      fillModalBody(bodyHtmlWithOverview(name, role, sub, p, html));
    })
    .catch(function(err){
      fillModalBody(bodyHtmlWithOverview(name, role, sub, p, '<div class="mt-d"><div class="mt-dtitle">Conversation memory</div><div class="mt-none">Couldn\u2019t load items \u2014 ' + escHtml(err.message) + '</div></div>'));
    });
}
function bodyHtmlWithOverview(name, role, sub, p, memoryHtml) {
  return (
    '<div class="mt-split">' +
      '<div class="mt-d"><div class="mt-dtitle">Overview</div><div class="mt-drow"><b>Person:</b> ' + escHtml(name) + '</div>' +
      '<div class="mt-drow"><b>Role:</b> ' + escHtml(role) + '</div>' +
      '<div class="mt-drow"><b>Next meeting:</b> ' + escHtml(sub) + '</div></div>' +
      '<div class="mt-d"><div class="mt-dtitle">Recorded this sync track</div>' +
      '<div class="mt-drow"><b>Open commitments:</b> ' + p.counts.pending_commitments + '</div>' +
      '<div class="mt-drow"><b>Open follow-ups:</b> ' + p.counts.pending_followups + '</div>' +
      '<div class="mt-drow"><b>Openers used:</b> ' + p.counts.openers_used + '</div></div>' +
    '</div>' + memoryHtml
  );
}

// ── View Previous Context detail ──
function mtOpenPrevious(eid) {
  var p = mtByEmp[eid];
  if (!p || !p.previous_session || !p.previous_session.session_id) return;
  var sid = p.previous_session.session_id;
  var name = p.employee.name;
  var created = p.previous_session.created_at ? fmtDate(new Date(p.previous_session.created_at)) : '';
  openModal(modalShell(escHtml(name) + ' \u2014 Previous Session', escHtml('Session recorded ' + created)));
  var bodyHtml = '<div class="mt-d"><div class="mt-dtitle">Items recorded in the previous session</div><div class="mt-none">Loading\u2026</div></div>';
  fillModalBody(bodyHtml);

  fetch('/api/conversation-memory?session_id=' + encodeURIComponent(sid))
    .then(function(r){ if (!r.ok) throw new Error('Failed (' + r.status + ')'); return r.json(); })
    .then(function(data) {
      var items = data.items || [];
      var used = items.filter(function(m){ return m.type === 'OPENER' || m.type === 'QUESTION'; });
      var commits = items.filter(function(m){ return m.type === 'COMMITMENT'; });
      var follows = items.filter(function(m){ return m.type === 'FOLLOW_UP'; });
      var notes = items.filter(function(m){ return m.type === 'NOTE'; });
      var html =
        memoryBlock('Openers &amp; Questions', used, 'None recorded in that session.') +
        memoryBlock('Commitments (from that session)', commits, 'None recorded.') +
        memoryBlock('Follow-ups (from that session)', follows, 'None recorded.') +
        memoryBlock('Notes', notes, 'None recorded.');
      fillModalBody(html);
    })
    .catch(function(err){
      fillModalBody('<div class="mt-d"><div class="mt-dtitle">Items recorded in the previous session</div><div class="mt-none">Couldn\u2019t load \u2014 ' + escHtml(err.message) + '</div></div>');
    });
}

// ── Schedule Meeting ──
function openSchedule() {
  var opts = mtEmployees.map(function(e){
    return '<option value="' + escHtml(e.id) + '">' + escHtml(e.name) + (e.position ? ' \u2014 ' + escHtml(e.position) : '') + '</option>';
  }).join('');
  var shell =
    '<div class="mt-modal">' +
      '<div class="mt-modal-head"><div><div class="mt-modal-title">Schedule a 1:1</div>' +
      '<div class="mt-modal-sub">Pick a real employee and a time \u2014 saved as a meeting</div></div>' +
      '<button class="mt-modal-x" type="button" title="Close">&times;</button></div>' +
      '<div class="mt-modal-body">' +
        '<form class="mt-form" id="mtScheduleForm">' +
          '<div><label class="form-label">Employee</label><select class="mt-field" id="mtSchedEmp" required><option value="">Select employee\u2026</option>' + opts + '</select></div>' +
          '<div><label class="form-label">Title</label><input class="mt-field" id="mtSchedTitle" type="text" placeholder="e.g. Weekly 1:1" required></div>' +
          '<div><label class="form-label">Date &amp; time</label><input class="mt-field" id="mtSchedWhen" type="datetime-local" required></div>' +
          '<div class="mt-formerr" id="mtSchedErr"></div>' +
          '<div style="display:flex;justify-content:flex-end;gap:0.6rem;">' +
            '<button class="btn btn-outline btn-sm" type="button" id="mtSchedCancel">Cancel</button>' +
            '<button class="btn btn-primary btn-sm" type="submit" id="mtSchedSave">Schedule</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  openModal(shell);
  $('mtSchedCancel').addEventListener('click', closeModal);
  $('mtScheduleForm').addEventListener('submit', submitSchedule);
}
function submitSchedule(ev) {
  ev.preventDefault();
  var errEl = $('mtSchedErr');
  errEl.textContent = '';
  var empId = $('mtSchedEmp').value;
  var title = $('mtSchedTitle').value.trim();
  var when = $('mtSchedWhen').value;
  if (!empId || !title || !when) { errEl.textContent = 'Please fill in employee, title, and date &amp; time.'; return; }
  var btn = $('mtSchedSave');
  btn.disabled = true; btn.textContent = 'Saving\u2026';
  fetch('/api/meetings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ employee_id: empId, title: title, scheduled_at: when })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(res) {
      if (!res.ok) throw new Error((res.d && res.d.error) || 'Request failed');
      closeModal();
      loadData();
    })
    .catch(function(err) {
      btn.disabled = false; btn.textContent = 'Schedule';
      errEl.textContent = 'Couldn\u2019t schedule: ' + err.message;
    });
}

// ── Init ──
(function init() {
  var pills = document.querySelectorAll('.mt-pill');
  pills.forEach(function(p){
    p.addEventListener('click', function(){
      pills.forEach(function(x){ x.classList.remove('active'); });
      p.classList.add('active');
      mtFilter = p.getAttribute('data-filter');
      render();
    });
  });
  $('mtSearch').addEventListener('input', function(){
    mtQuery = this.value.trim().toLowerCase();
    render();
  });
  $('syncRoomBtn').addEventListener('click', function(){ window.location.href = '/sync/room'; });
  $('scheduleMeetingBtn').addEventListener('click', openSchedule);
  loadData();
})();

document.addEventListener('DOMContentLoaded', function() {
  var sidebar = document.querySelector('.sidebar');
  if (sidebar) {
    sidebar.classList.remove('gsap-hidden');
    if (window.gsap) {
      gsap.set(sidebar, { x: -72, opacity: 0 });
      gsap.to(sidebar, { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' });
    } else {
      sidebar.style.opacity = '1';
    }
  }
});
</script>

<!-- Theme toggle -->
<script>
(function() {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    if (next === 'dark') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    try { localStorage.setItem('voohr-theme', next); } catch (e) {}
  });
})();
</script>
