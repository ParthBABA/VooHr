<style>
  .gsap-hidden { opacity: 0 !important; }

  /* ── Filter Toolbar ── */
  .filter-bar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:1.5rem;}
  .filter-search{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.8rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;flex:1;min-width:180px;max-width:340px;transition:border-color 0.2s;}
  .filter-search:focus-within{border-color:var(--border-lit);}
  .filter-search svg{opacity:0.45;flex-shrink:0;}
  .filter-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ivory);font-family:var(--font-m);font-size:0.75rem;}
  .filter-search input::placeholder{color:var(--ivory-faint);}
  .filter-select{padding:0.5rem 0.8rem;background:var(--surface);border:1px solid var(--border);color:var(--ivory-dim);font-family:var(--font-m);font-size:0.72rem;cursor:pointer;transition:border-color 0.2s;appearance:auto;}
  .filter-select:focus{border-color:var(--amber);outline:none;}
  .filter-label{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ivory-faint);white-space:nowrap;}

  /* ── Folder Grid ── */
  .folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;}
  .folder-card{background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:1.2rem;cursor:pointer;transition:all 0.3s var(--ease-out);position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
  .folder-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,var(--violet),var(--amber));transform:scaleX(0);transform-origin:left;transition:transform 0.4s var(--ease-out);}
  .folder-card:hover{border-color:var(--border-lit);transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .folder-card:hover::before{transform:scaleX(1);}
  .folder-card-top{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.9rem;}
  .folder-card-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--amber));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:0.72rem;font-weight:700;color:var(--void);flex-shrink:0;}
  .folder-card-name{font-family:var(--font-d);font-size:0.95rem;font-weight:600;color:var(--ivory);line-height:1.2;}
  .folder-card-id{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.06em;color:var(--ivory-faint);margin-top:2px;}
  .folder-card-dept{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ivory-dim);padding:0.2rem 0.5rem;background:var(--surface);border:1px solid var(--border);border-radius:4px;display:inline-block;margin-bottom:0.7rem;}
  .folder-card-meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-m);font-size:0.6rem;color:var(--ivory-faint);margin-top:auto;}
  .folder-card-meta .folder-empty-hint{font-style:italic;color:var(--ivory-faint);opacity:0.6;}
  .folder-grid-empty{text-align:center;padding:4rem 2rem;}
  .folder-grid-empty svg{margin-bottom:1rem;opacity:0.3;}
  .folder-grid-empty .fge-title{font-family:var(--font-rc);font-size:1rem;color:var(--ivory-dim);margin-bottom:0.4rem;}
  .folder-grid-empty .fge-sub{font-family:var(--font-m);font-size:0.68rem;color:var(--ivory-faint);}

  /* ── Folder View ── */
  .folder-view{display:none;}
  .folder-breadcrumb{font-family:var(--font-m);font-size:0.68rem;color:var(--ivory-faint);margin-bottom:1.2rem;display:flex;align-items:center;gap:0.4rem;}
  .folder-breadcrumb a{color:var(--amber);text-decoration:none;transition:color 0.2s;}
  .folder-breadcrumb a:hover{color:var(--ivory);}
  .folder-breadcrumb .bc-sep{color:var(--ivory-faint);opacity:0.5;}
  .folder-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;}
  .folder-header-left{display:flex;align-items:center;gap:1rem;}
  .folder-header-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--amber));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:0.9rem;font-weight:700;color:var(--void);flex-shrink:0;}
  .folder-header-name{font-family:var(--font-d);font-size:1.2rem;font-weight:600;color:var(--ivory);}
  .folder-header-meta{font-family:var(--font-m);font-size:0.65rem;color:var(--ivory-faint);margin-top:3px;}
  .folder-header-actions{display:flex;align-items:center;gap:0.6rem;}

  /* ── New Session Box ── */
  .new-session-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin-bottom:1.5rem;transition:border-color 0.2s;}
  .new-session-box:focus-within{border-color:var(--border-lit);}
  .nsb-label{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ivory-faint);margin-bottom:0.6rem;}
  .nsb-textarea{width:100%;min-height:80px;max-height:240px;padding:0.7rem;background:var(--ink);border:1px solid var(--border);border-radius:6px;color:var(--ivory);font-family:var(--font-rc);font-size:0.85rem;line-height:1.6;resize:vertical;outline:none;transition:border-color 0.2s;}
  .nsb-textarea:focus{border-color:var(--amber);}
  .nsb-textarea::placeholder{color:var(--ivory-faint);}
  .nsb-controls{display:flex;align-items:center;justify-content:space-between;margin-top:0.8rem;flex-wrap:wrap;gap:0.6rem;}
  .nsb-controls-left{display:flex;align-items:center;gap:0.6rem;}
  .nsb-source-select{padding:0.4rem 0.7rem;background:var(--ink);border:1px solid var(--border);border-radius:5px;color:var(--ivory-dim);font-family:var(--font-m);font-size:0.68rem;cursor:pointer;outline:none;}
  .nsb-source-select:focus{border-color:var(--amber);}

  /* ── Sessions List inside Folder ── */
  .folder-sessions-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.6rem;}
  .folder-sessions-title{font-family:var(--font-m);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ivory-faint);}
  .folder-sessions-count{font-family:var(--font-m);font-size:0.6rem;color:var(--ivory-dim);}
  .folder-sessions-filter{display:flex;align-items:center;gap:0.5rem;}
  .fs-filter-input{padding:0.4rem 0.7rem;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--ivory);font-family:var(--font-m);font-size:0.7rem;width:180px;outline:none;transition:border-color 0.2s;}
  .fs-filter-input:focus{border-color:var(--border-lit);}
  .fs-filter-input::placeholder{color:var(--ivory-faint);}
  .session-list{display:flex;flex-direction:column;gap:8px;}
  .session-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0.85rem 1rem;border:1px solid var(--border);background:rgba(130,160,220,0.02);border-radius:8px;transition:all 0.2s;cursor:default;}
  .session-row:hover{border-color:var(--border-lit);background:var(--ivory-ghost);}
  .session-row-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .session-row-info{min-width:0;}
  .session-row-date{font-family:var(--font-rc);font-size:0.8rem;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .session-row-snippet{font-family:var(--font-m);font-size:0.58rem;color:var(--ivory-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;}
  .session-row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .session-row-chips{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .preview-chip{font-family:var(--font-m);font-size:0.52rem;font-weight:600;letter-spacing:0.04em;padding:0.15rem 0.45rem;border-radius:3px;white-space:nowrap;}
  .preview-chip.high{color:var(--teal);background:var(--teal-soft);}
  .preview-chip.medium{color:var(--amber);background:var(--amber-soft);}
  .preview-chip.low{color:var(--red);background:var(--red-soft);}
  .preview-chip.pending{color:var(--ivory-faint);background:var(--surface);}
  .preview-chip.warn{color:var(--amber);background:var(--amber-soft);}
  .folder-empty{text-align:center;padding:3rem 1rem;}
  .folder-empty svg{margin-bottom:0.8rem;opacity:0.25;}
  .folder-empty .fe-title{font-family:var(--font-rc);font-size:0.9rem;color:var(--ivory-dim);margin-bottom:0.3rem;}
  .folder-empty .fe-sub{font-family:var(--font-m);font-size:0.62rem;color:var(--ivory-faint);}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   AI SYNC — Folder-based Employee Sync View
   ═══════════════════════════════════════════════════════════════ */

var employees = [];
var folderCache = {};
var currentView = 'grid';
var currentFolderId = null;

function escHtml(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function formatDate(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  var now = Date.now();
  var then = new Date(dateStr).getTime();
  var diff = Math.max(0, now - then);
  var sec = Math.floor(diff / 1000);
  if (sec < 60) return 'just now';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  var days = Math.floor(hr / 24);
  if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago';
  var months = Math.floor(days / 30);
  if (months < 12) return months + 'mo ago';
  return Math.floor(months / 12) + 'y ago';
}

function debounce(fn, delay) {
  var timer;
  return function() {
    var args = arguments;
    var ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(ctx, args); }, delay);
  };
}

function showToast(msg, isError) {
  var t = document.createElement('div');
  t.className = 'toast-notification';
  t.textContent = msg;
  if (isError) {
    t.style.background = 'var(--red-soft)';
    t.style.borderColor = 'rgba(232,69,69,0.3)';
    t.style.color = 'var(--red)';
  }
  document.body.appendChild(t);
  if (window.gsap) {
    gsap.set(t, { y: 60, opacity: 0 });
    gsap.to(t, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' });
    setTimeout(function() {
      gsap.to(t, { y: 60, opacity: 0, duration: 0.3, ease: 'power3.in', onComplete: function() { t.remove(); }});
    }, 4000);
  } else {
    setTimeout(function() { t.remove(); }, 4000);
  }
}

function initials(name) {
  return (name || '').trim().split(' ').map(function(s) { return s.charAt(0); }).join('').toUpperCase().slice(0, 2) || '?';
}

function sessionStatusLabel(s) {
  if (!s) return 'Draft';
  var map = { draft:'Draft', transcribed:'Transcribed', processing:'Processing', completed:'Completed', failed:'Failed' };
  return map[s] || s;
}

function sessionBadgeClass(s) {
  if (!s) return 'badge draft';
  var map = { draft:'badge draft', transcribed:'badge info', processing:'badge warning', completed:'badge healthy', failed:'badge critical' };
  return map[s] || 'badge draft';
}

function analysisPreviewChips(s) {
  var a = s.analysis;
  if (!a || !a.summary) return '<span class="preview-chip pending">Analysis pending</span>';
  var chips = [];
  var risks = a.risks || {};
  var rf = (risks.risk_factors || [])[0];
  if (rf) chips.push('<span class="preview-chip warn">' + escHtml(rf) + '</span>');
  var ps = a.psychological_safety || {};
  var safety = ps.safety_score;
  if (safety !== null && safety !== undefined) {
    var sCls = safety >= 70 ? 'high' : (safety >= 40 ? 'medium' : 'low');
    chips.push('<span class="preview-chip ' + sCls + '">Psych Safety ' + safety + '/100</span>');
  }
  var follow = Math.max(risks.burnout_index || 0, risks.attrition_risk_pct || 0);
  var fCls = follow >= 70 ? 'high' : (follow >= 40 ? 'medium' : 'low');
  var fLabel = follow >= 70 ? 'High priority' : (follow >= 40 ? 'Medium priority' : 'Low');
  chips.push('<span class="preview-chip ' + fCls + '">Follow-up: ' + fLabel + '</span>');
  return chips.join('');
}

/* ── Department list (derived from employees) ── */
function getDepartments() {
  var seen = {};
  var list = [];
  employees.forEach(function(e) {
    var d = e.department || '';
    if (d && !seen[d]) { seen[d] = 1; list.push(d); }
  });
  return list.sort();
}

/* ═══════════════════════════════════════════════════════════
   VIEW: GRID (Folder cards)
   ═══════════════════════════════════════════════════════════ */

function renderGrid() {
  currentView = 'grid';
  currentFolderId = null;

  document.getElementById('pageTitle').textContent = 'AI Sync';
  document.getElementById('breadcrumbRow').innerHTML = '<span>Dashboard</span> / <span>AI Sync</span>';

  var depts = getDepartments();
  var deptOpts = '<option value="">All Departments</option>';
  depts.forEach(function(d) { deptOpts += '<option value="' + escHtml(d) + '">' + escHtml(d) + '</option>'; });

  var html =
    '<div class="filter-bar">' +
      '<div class="filter-search">' +
        '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<input type="text" id="gridSearch" placeholder="Search by name, ID, email, or department..." autocomplete="off">' +
      '</div>' +
      '<select class="filter-select" id="gridDeptFilter">' + deptOpts + '</select>' +
      '<select class="filter-select" id="gridSort">' +
        '<option value="name">Sort: Name</option>' +
        '<option value="department">Sort: Department</option>' +
        '<option value="id">Sort: Employee ID</option>' +
      '</select>' +
    '</div>' +
    '<div class="folder-grid" id="folderGrid"></div>';

  document.getElementById('contentArea').innerHTML = html;

  var gridEl = document.getElementById('folderGrid');
  renderFolderCards(gridEl, employees);

  document.getElementById('gridSearch').addEventListener('input', debounce(function() { applyGridFilters(); }, 150));
  document.getElementById('gridDeptFilter').addEventListener('change', function() { applyGridFilters(); });
  document.getElementById('gridSort').addEventListener('change', function() { applyGridFilters(); });
}

function applyGridFilters() {
  var q = (document.getElementById('gridSearch').value || '').trim().toLowerCase();
  var dept = document.getElementById('gridDeptFilter').value;
  var sort = document.getElementById('gridSort').value;

  var filtered = employees.filter(function(e) {
    var hay = ((e.name || '') + ' ' + (e.employee_id || '') + ' ' + (e.email || '') + ' ' + (e.department || '')).toLowerCase();
    if (q && hay.indexOf(q) === -1) return false;
    if (dept && e.department !== dept) return false;
    return true;
  });

  filtered.sort(function(a, b) {
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
    if (sort === 'department') return (a.department || '').localeCompare(b.department || '') || (a.name || '').localeCompare(b.name || '');
    if (sort === 'id') return (a.employee_id || '').localeCompare(b.employee_id || '');
    return 0;
  });

  var gridEl = document.getElementById('folderGrid');
  renderFolderCards(gridEl, filtered);
}

function renderFolderCards(container, list) {
  if (!list.length) {
    container.innerHTML =
      '<div class="folder-grid-empty" style="grid-column:1/-1;">' +
        '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--ivory-dim)" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>' +
        '<div class="fge-title">No employees found</div>' +
        '<div class="fge-sub">Try adjusting your search or filters</div>' +
      '</div>';
    return;
  }

  var frag = '';
  list.forEach(function(emp) {
    var ini = initials(emp.name);
    var id = emp.id == null ? '' : emp.id;
    frag +=
      '<div class="folder-card" data-emp-id="' + escHtml(id) + '">' +
        '<div class="folder-card-top">' +
          '<div class="folder-card-avatar">' + ini + '</div>' +
          '<div>' +
            '<div class="folder-card-name">' + escHtml(emp.name || 'Unnamed') + '</div>' +
            '<div class="folder-card-id">' + escHtml(emp.employee_id || '') + '</div>' +
          '</div>' +
        '</div>' +
        (emp.department ? '<div class="folder-card-dept">' + escHtml(emp.department) + '</div>' : '') +
        '<div class="folder-card-meta">' +
          '<span class="folder-empty-hint">Click to view syncs</span>' +
          '<span></span>' +
        '</div>' +
      '</div>';
  });
  container.innerHTML = frag;

  container.querySelectorAll('.folder-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var empId = card.getAttribute('data-emp-id');
      if (empId) openFolder(empId);
    });
  });

  if (window.gsap) {
    var cards = container.querySelectorAll('.folder-card');
    gsap.set(cards, { opacity: 0, y: 12 });
    gsap.to(cards, { opacity: 1, y: 0, duration: 0.35, stagger: 0.04, ease: 'power3.out' });
  }
}

/* ═══════════════════════════════════════════════════════════
   VIEW: FOLDER (Opened employee sessions)
   ═══════════════════════════════════════════════════════════ */

function openFolder(empId) {
  var emp = employees.find(function(e) { return String(e.id) === String(empId); });
  if (!emp) {
    showToast('Employee not found — it may have been removed.', true);
    renderGrid();
    return;
  }

  currentView = 'folder';
  currentFolderId = empId;

  document.getElementById('pageTitle').textContent = emp.name || 'Employee';
  document.getElementById('breadcrumbRow').innerHTML =
    '<a href="#" id="bcGrid">Dashboard</a> <span class="bc-sep">/</span> ' +
    '<a href="#" id="bcSync">AI Sync</a> <span class="bc-sep">/</span> ' +
    '<span>' + escHtml(emp.name || '') + '</span>';

  document.getElementById('bcGrid').addEventListener('click', function(e) { e.preventDefault(); showGrid(); });
  document.getElementById('bcSync').addEventListener('click', function(e) { e.preventDefault(); showGrid(); });

  var ini = initials(emp.name);
  var html =
    '<div class="folder-view" id="folderView" style="display:block;">' +
      '<div class="folder-header">' +
        '<div class="folder-header-left">' +
          '<div class="folder-header-avatar">' + ini + '</div>' +
          '<div>' +
            '<div class="folder-header-name">' + escHtml(emp.name || 'Employee') + '</div>' +
            '<div class="folder-header-meta">' +
              escHtml(emp.employee_id || '') +
              (emp.department ? ' · ' + escHtml(emp.department) : '') +
              (emp.position ? ' · ' + escHtml(emp.position) : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="folder-header-actions">' +
          '<a href="dictation.html?employee_id=' + encodeURIComponent(empId) + '" class="btn btn-sm btn-outline" style="text-decoration:none;">' +
            '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>' +
            'Record via Dictation' +
          '</a>' +
        '</div>' +
      '</div>' +

      '<div class="new-session-box">' +
        '<div class="nsb-label">New Session</div>' +
        '<textarea class="nsb-textarea" id="nsTextarea" placeholder="Type or paste a conversation, script, or notes..."></textarea>' +
        '<div class="nsb-controls">' +
          '<div class="nsb-controls-left">' +
            '<select class="nsb-source-select" id="nsSource">' +
              '<option value="manual_entry">Manual Entry</option>' +
              '<option value="pasted_script">Pasted Script</option>' +
              '<option value="pasted_conversation">Pasted Conversation</option>' +
            '</select>' +
          '</div>' +
          '<button class="btn-session" id="nsSaveBtn">' +
            '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>' +
            'Save Session' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="folder-sessions-header">' +
        '<div style="display:flex;align-items:center;gap:0.8rem;">' +
          '<div class="folder-sessions-title">Sessions</div>' +
          '<div class="folder-sessions-count" id="fsCount"></div>' +
        '</div>' +
        '<div class="folder-sessions-filter">' +
          '<input type="text" class="fs-filter-input" id="fsKeyword" placeholder="Search transcripts...">' +
          '<select class="filter-select" id="fsStatusFilter" style="font-size:0.68rem;padding:0.4rem 0.6rem;">' +
            '<option value="">All Statuses</option>' +
            '<option value="transcribed">Transcribed</option>' +
            '<option value="processing">Processing</option>' +
            '<option value="completed">Completed</option>' +
            '<option value="failed">Failed</option>' +
            '<option value="draft">Draft</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="session-list" id="sessionList"></div>' +
      '<div class="folder-empty" id="folderEmpty" style="display:none;">' +
        '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--ivory-dim)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/></svg>' +
        '<div class="fe-title">No sessions yet</div>' +
        '<div class="fe-sub">Add a new session above or record via dictation</div>' +
      '</div>' +
    '</div>';

  document.getElementById('contentArea').innerHTML = html;

  document.getElementById('nsSaveBtn').addEventListener('click', function() { handleCreateSession(empId); });
  document.getElementById('nsTextarea').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleCreateSession(empId);
  });
  document.getElementById('fsKeyword').addEventListener('input', debounce(function() { filterSessions(); }, 200));
  document.getElementById('fsStatusFilter').addEventListener('change', function() { filterSessions(); });

  if (window.history && window.history.pushState) {
    window.history.pushState({ employee_id: empId }, '', '/sync?employee_id=' + encodeURIComponent(empId));
  }

  loadFolderSessions(empId);
}

function showGrid() {
  currentView = 'grid';
  currentFolderId = null;

  if (window.history && window.history.pushState) {
    window.history.pushState({}, '', '/sync');
  }

  renderGrid();
}

function loadFolderSessions(empId) {
  var listEl = document.getElementById('sessionList');
  var countEl = document.getElementById('fsCount');
  var emptyEl = document.getElementById('folderEmpty');
  if (!listEl) return;

  listEl.innerHTML = '';
  emptyEl.style.display = 'none';
  countEl.textContent = 'Loading...';

  fetch('/api/sessions?employee_id=' + encodeURIComponent(empId) + '&_t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('Failed to load sessions');
      return r.json();
    })
    .then(function(data) {
      var sessions = (data && data.sessions) || [];
      folderCache[empId] = sessions;
      renderSessionList(sessions);
    })
    .catch(function(err) {
      console.error('Failed to load sessions:', err);
      countEl.textContent = 'Failed to load';
      showToast('Could not load sessions', true);
    });
}

function renderSessionList(sessions) {
  var listEl = document.getElementById('sessionList');
  var countEl = document.getElementById('fsCount');
  var emptyEl = document.getElementById('folderEmpty');
  if (!listEl) return;

  var keyword = ((document.getElementById('fsKeyword') || {}).value || '').trim().toLowerCase();
  var statusF = ((document.getElementById('fsStatusFilter') || {}).value || '').trim();

  var filtered = sessions.filter(function(s) {
    if (statusF && s.status !== statusF) return false;
    if (keyword) {
      var hay = ((s.transcript && (s.transcript.edited || s.transcript.raw)) || '').toLowerCase();
      var src = (s.source || '').toLowerCase();
      if (hay.indexOf(keyword) === -1 && src.indexOf(keyword) === -1) return false;
    }
    return true;
  });

  listEl.innerHTML = '';
  countEl.textContent = sessions.length + ' session' + (sessions.length !== 1 ? 's' : '') + (filtered.length !== sessions.length ? ' (' + filtered.length + ' shown)' : '');

  if (!filtered.length) {
    emptyEl.style.display = 'block';
    if (sessions.length && filtered.length === 0) {
      emptyEl.querySelector('.fe-title').textContent = 'No matching sessions';
      emptyEl.querySelector('.fe-sub').textContent = 'Try adjusting your search or filter';
    } else {
      emptyEl.querySelector('.fe-title').textContent = 'No sessions yet';
      emptyEl.querySelector('.fe-sub').textContent = 'Add a new session above or record via dictation';
    }
    return;
  }
  emptyEl.style.display = 'none';

  filtered.forEach(function(s) {
    var statusCls = sessionBadgeClass(s.status);
    var statusLbl = sessionStatusLabel(s.status);
    var wordCount = (s.transcript && s.transcript.word_count) || 0;
    var snippet = s.transcript && (s.transcript.edited || s.transcript.raw);
    if (snippet && snippet.length > 120) snippet = snippet.substring(0, 120) + '...';
    var isAnalyzing = s.status === 'processing';

    var row = document.createElement('div');
    row.className = 'session-row';
    row.innerHTML =
      '<div class="session-row-left">' +
        '<span class="' + statusCls + '" style="flex-shrink:0;">' + escHtml(statusLbl) + '</span>' +
        '<div class="session-row-info">' +
          '<div class="session-row-date">' + formatDate(s.created_at) + (wordCount ? ' · ' + wordCount + ' words' : '') + '</div>' +
          (snippet ? '<div class="session-row-snippet">' + escHtml(snippet) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="session-row-right">' +
        '<div class="session-row-chips">' + analysisPreviewChips(s) + '</div>' +
        '<button class="btn btn-sm' + (s.analysis && s.analysis.summary ? '' : ' btn-primary') + '" data-role="open-workspace" data-session-id="' + s.id + '" ' + (isAnalyzing ? 'disabled' : '') + ' style="gap:6px;white-space:nowrap;">' +
          '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          (isAnalyzing ? 'Analyzing...' : 'Open') +
        '</button>' +
      '</div>';

    row.querySelector('[data-role="open-workspace"]').addEventListener('click', function(e) {
      e.stopPropagation();
      window.location.href = '/workspace?session_id=' + s.id + '&employee_id=' + currentFolderId;
    });

    listEl.appendChild(row);
  });

  if (window.gsap) {
    var rows = listEl.querySelectorAll('.session-row');
    gsap.set(rows, { opacity: 0, y: 8 });
    gsap.to(rows, { opacity: 1, y: 0, duration: 0.3, stagger: 0.03, ease: 'power3.out' });
  }
}

function filterSessions() {
  var empId = currentFolderId;
  if (!empId || !folderCache[empId]) return;
  renderSessionList(folderCache[empId]);
}

/* ── Create Session ── */
function handleCreateSession(empId) {
  var textarea = document.getElementById('nsTextarea');
  var sourceSel = document.getElementById('nsSource');
  var saveBtn = document.getElementById('nsSaveBtn');
  if (!textarea || !saveBtn) return;

  var rawText = (textarea.value || '').trim();
  if (!rawText) {
    showToast('Enter some text before saving', true);
    textarea.focus();
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';

  fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      employee_id: empId,
      raw_text: rawText,
      edited_text: rawText,
      source: (sourceSel && sourceSel.value) || 'manual_entry',
      language: 'en'
    })
  })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'save failed'); });
    return r.json();
  })
  .then(function(newSession) {
    textarea.value = '';
    showToast('Session saved successfully');

    if (!folderCache[empId]) folderCache[empId] = [];
    folderCache[empId].unshift(newSession);
    renderSessionList(folderCache[empId]);

    saveBtn.disabled = false;
    saveBtn.innerHTML =
      '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>' +
      'Save Session';
  })
  .catch(function(err) {
    console.error('Failed to save session:', err);
    showToast('Failed to save: ' + err.message, true);
    saveBtn.disabled = false;
    saveBtn.innerHTML =
      '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>' +
      'Save Session';
  });
}

/* ═══════════════════════════════════════════════════════════
   INIT & HISTORY
   ═══════════════════════════════════════════════════════════ */

function handlePopState() {
  var empId = new URLSearchParams(window.location.search).get('employee_id');
  if (empId) {
    var emp = employees.find(function(e) { return String(e.id) === String(empId); });
    if (emp) {
      openFolder(empId);
    } else {
      showToast('Employee not found', true);
      renderGrid();
    }
  } else {
    renderGrid();
  }
}

window.addEventListener('popstate', handlePopState);

document.addEventListener('DOMContentLoaded', function() {
  /* ── Reveal sidebar immediately (no dependency on API call) ── */
  var sidebar = document.querySelector('.sidebar');
  if (sidebar) {
    sidebar.classList.remove('gsap-hidden');
    if (window.gsap) {
      gsap.set(sidebar, { x: -72, opacity: 0 });
      gsap.to(sidebar, { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' });
    } else {
      sidebar.style.opacity = '1';
    }
  }

  fetch('/api/employees')
    .then(function(r) {
      if (!r.ok) throw new Error('Failed to load');
      return r.json();
    })
    .then(function(data) {
      employees = (data && data.employees) || [];

      var empId = new URLSearchParams(window.location.search).get('employee_id');
      if (empId) {
        var emp = employees.find(function(e) { return String(e.id) === String(empId); });
        if (emp) {
          openFolder(empId);
        } else {
          showToast('Employee not found — showing all employees', true);
          renderGrid();
        }
      } else {
        renderGrid();
      }
    })
    .catch(function(err) {
      console.error('Failed to load employees:', err);
      document.getElementById('contentArea').innerHTML =
        '<div class="folder-grid-empty">' +
          '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--ivory-dim)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' +
          '<div class="fge-title">Could not load employees</div>' +
          '<div class="fge-sub">Please try refreshing the page</div>' +
        '</div>';
    });
});

/* ── Theme toggle ── */
(function() {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    if (next === 'dark') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    try { localStorage.setItem('voohr-theme', next); } catch (e) {}
  });
})();
</script>
