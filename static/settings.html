<!DOCTYPE html>

<link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,400,600,700&f[]=cabinet-grotesk@300,400,500,700,800&display=swap" rel="stylesheet"/>

<body style="visibility:hidden">
<script>
(function(){
  function populate(data){
    var nameEl = document.getElementById('userName');
    var roleEl = document.getElementById('userRole');
    var avatarEl = document.getElementById('userAvatar');
    if (nameEl) nameEl.textContent = data.name;
    if (roleEl) roleEl.textContent = data.role === 'admin' ? 'HR Admin' : data.role;
    if (avatarEl) avatarEl.textContent = (data.name || 'U').trim().charAt(0).toUpperCase();
    document.body.style.visibility = 'visible';
  }

  fetch('/api/me').then(function(res){
    if (!res.ok) { window.location.href = 'signin.html'; return null; }
    return res.json();
  }).then(function(data){
    if (!data) return;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ populate(data); });
    } else {
      populate(data);
    }
  }).catch(function(){
    window.location.href = 'signin.html';
  });
})();
</script>
<button class="mobile-toggle" id="mobileToggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>

<div class="page-wrapper">

      </div>
    </div>

    <div class="content-area">

        <div class="stat-label" style="margin-bottom:0.4rem;">Appearance</div>
        <div style="font-family:var(--font-d);font-size:1.15rem;font-weight:600;margin-bottom:0.6rem;">Theme</div>
        <div style="font-size:0.85rem;color:var(--ivory-dim);margin-bottom:1.4rem;line-height:1.6;">
          Choose how VooVr looks on this device. This applies across the dashboard, directory, and sync rooms.
        </div>

        <div class="lang-toggle" id="themeToggle" style="width:fit-content;">
          <button class="lang-btn" data-theme-switch="dark" style="padding:0.6rem 1.4rem;">Dark</button>
          <button class="lang-btn" data-theme-switch="light" style="padding:0.6rem 1.4rem;">Light</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
document.getElementById('signOutBtn').addEventListener('click', async function(){
  try { await fetch('/auth/logout', { method: 'POST' }); } catch (err) {}
  window.location.href = 'signin.html';
});

(function(){
  var buttons = document.querySelectorAll('#themeToggle [data-theme-switch]');

  function syncActiveButton(){
    var current = window.voovrGetTheme ? window.voovrGetTheme() : 'dark';
    buttons.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme-switch') === current);
    });
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var theme = btn.getAttribute('data-theme-switch');
      if (window.voovrSetTheme) window.voovrSetTheme(theme);
      syncActiveButton();
    });
  });

  syncActiveButton();
})();

window.addEventListener('load', function() {
  var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

  var sidebar = document.querySelector('.sidebar');
  gsap.set(sidebar, { x: -260, opacity: 0 });
  tl.to(sidebar, { x: 0, opacity: 1, duration: 0.6 });

  var pageTitle = document.querySelector('.page-title');
  gsap.set(pageTitle, { opacity: 0, y: 16 });
  tl.to(pageTitle, { opacity: 1, y: 0, duration: 0.5 }, '-=0.35');

  var cards = document.querySelectorAll('.card');
  gsap.set(cards, { opacity: 0, y: 30 });
  tl.to(cards, { opacity: 1, y: 0, duration: 0.5 }, '-=0.2');
});
</script>
</body>
