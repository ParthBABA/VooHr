<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Copilot - Forgot Password</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/csrf.js"></script>
</head>
<body style="background:var(--void); color:var(--ivory); font-family:var(--font-b); font-size:15px; line-height:1.6; min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px 24px; box-sizing:border-box;">
  <div class="login-card" style="background:var(--ink); border:1px solid var(--border); border-radius:12px; padding:40px 32px 32px; max-width:420px; width:100%; box-shadow:var(--shadow-md); position:relative; z-index:10;">
    
    <!-- Logo -->
    <div class="text-center mb-6">
<img src="voovr-logo-full.webp" alt="voovrHR" style="width:120px; height:auto; border-radius:8px; margin:0 auto 12px; display:block;">
      <h1 style="font-family:var(--font-d); font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; color:var(--ivory); text-transform:uppercase; margin:0;">Forgot Password</h1>
      <p style="font-family:var(--font-lato); font-size:0.85rem; color:var(--ivory-faint); letter-spacing:0.04em; text-transform:uppercase; margin:8px 0 0;">Enter your email to receive a reset link</p>
    </div>

    <!-- Form -->
    <form id="forgotForm">
      <!-- Email -->
      <div style="margin-bottom:24px;">
        <label style="display:block; font-family:var(--font-lato); font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); margin-bottom:8px;">Email address</label>
        <input type="email" id="emailInput" style="width:100%; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ivory); font-size:0.9rem; outline:none; transition:border-color 0.2s;" placeholder="you@company.com">
      </div>

      <!-- Submit button -->
      <div style="text-align:center; margin-bottom:24px;">
        <button type="submit" class="btn btn-primary w-full" style="background:linear-gradient(135deg,var(--violet),var(--amber)); color:var(--void); font-family:var(--font-lato); font-weight:700; font-size:0.9rem; letter-spacing:0.04em; text-transform:uppercase; padding:16px 24px; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px; border-radius:8px; border:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><line x1="9" y1="20" x2="9.01" y2="20"/><line x1="15" y1="20" x2="15.01" y2="20"/></svg>
          Send Reset Link
        </button>
      </div>

      <!-- Back to login -->
      <div style="text-align:center; font-size:0.7rem; color:var(--ivory-faint);">
        <a href="/login" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">← Back to Sign In</a>
      </div>
    </form>

  </div>

  <footer style="margin-top:28px; text-align:center; font-size:0.7rem; color:var(--ivory-faint); width:100%;">
    <span>© 2026 HR Copilot. All rights reserved.</span>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="/privacy" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Privacy Policy</a>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="/terms" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Terms of Service</a>
    <span style="margin-left:16px; color:var(--ivory-faint);">|</span>
    <a href="mailto:voovrhr@gmail.com" style="color:var(--amber); letter-spacing:0.05em; text-transform:uppercase;">Contact</a>
  </footer>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      if (!email) { alert('Please enter your email.'); return; }
      const btn = this.querySelector('button[type="submit"]');
      const original = btn.innerHTML;
      btn.innerHTML = 'Sending...';
      btn.disabled = true;
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.ok) {
          alert('If the email exists, a reset link has been sent.');
        } else {
          alert(data.message || 'Failed to send reset link.');
        }
      } catch {
        alert('Network error — could not reach the server.');
      } finally {
        btn.innerHTML = original;
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
