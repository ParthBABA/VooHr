<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VooVr - Forgot Password</title>
  <!-- shared-head -->
  <link rel="stylesheet" href="/style.css">
  <script src="/csrf.js"></script>
  <script src="/ui-feedback.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="/voovr-logo-full.webp" alt="VooVr" class="auth-logo">
    <h1 class="auth-title">Forgot password?</h1>
    <p class="auth-subtitle">Enter your email to request a password reset.</p>
    <form id="forgotForm" novalidate>
      <div data-feedback hidden></div>
      <div class="auth-field"><label for="emailInput">Email address</label><input type="email" id="emailInput" autocomplete="email" placeholder="you@company.com" required></div>
      <button type="submit" class="auth-primary">Send reset link</button>
    </form>
    <p class="auth-subtitle auth-resend"><a href="/login">← Back to sign in</a></p>
  </main>
  <footer class="site-footer"><span>© 2026 VooVr. All rights reserved.</span><nav aria-label="Legal"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="mailto:voovrhr@gmail.com">Contact</a></nav></footer>
  <script>
  document.getElementById('forgotForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var button = this.querySelector('[type="submit"]');
    if (button.disabled) return;
    VooVrUI.clear();
    var email = document.getElementById('emailInput');
    if (!email.value.trim() || !email.validity.valid) return VooVrUI.show('Please enter a valid email address.');
    button.disabled = true;
    button.textContent = 'Sending…';
    try {
      var response = await fetch('/auth/forgot-password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email.value.trim()})});
      var data = await response.json();
      if (data.ok) VooVrUI.show(data.message || 'If the email exists, a reset link has been sent.', {kind: 'success'});
      else VooVrUI.show(data.message || 'Failed to send reset link. Please try again.');
    } catch (error) { VooVrUI.show('Could not reach the server. Check your connection and try again.'); }
    finally { button.disabled = false; button.textContent = 'Send reset link'; }
  });
  </script>
</body>
</html>
