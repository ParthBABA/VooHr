<meta name="description" content="{{ page_description }}">
<meta name="theme-color" content="#080A0F">
<script src="/theme.js"></script>
<script src="/site-shell.js" defer></script>
<link rel="icon" type="image/png" sizes="64x64" href="/voovr-icon-64.png">
<link rel="apple-touch-icon" href="/voovr-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VooVr">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ page_url }}">
<meta property="og:image" content="{{ site_base }}/voovr-logo-full.png">
<meta property="og:image:alt" content="VooVr — employee intelligence for modern HR teams">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ site_base }}/voovr-logo-full.png">
{% if public_page %}<link rel="canonical" href="{{ page_url }}">
{% else %}<meta name="robots" content="noindex, nofollow">
{% endif %}
